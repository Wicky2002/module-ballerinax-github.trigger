      properties:
        action:
          description: "The action that was performed. Can be one of: queued, waiting, completed, in_progress."
          type: string
          enum:
            - completed
            - in_progress
            - queued
            - waiting
        workflow_job:
          $ref: '#/components/schemas/WorkflowJob'
        deployment:
          $ref: '#/components/schemas/Deployment'
          description: The deployment associated with the workflow job (if applicable)

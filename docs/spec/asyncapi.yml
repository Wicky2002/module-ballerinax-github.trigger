          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    RepositoryPayload:
      type: object
      description: Payload for repository events
      required:
        - action
      properties:
        action:
          description: "The action that was performed. Can be one of: created, deleted, archived, unarchived, edited, renamed, transferred, publicized, privatized."
          type: string
          enum:
            - archived
            - created
            - deleted
            - edited
            - privatized
            - publicized
            - renamed
            - transferred
            - unarchived
        changes:
          type: object
          description: For edited/renamed/transferred events, the changes that occurred
          properties:
            description:
              type: object
              description: The repository's previous description, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
                  nullable: true
            homepage:
              type: object
              description: The repository's previous homepage URL, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
                  nullable: true
            topics:
              type: object
              description: The repository's previous topics, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: array
                  items:
                    type: string
            default_branch:
              type: object
              description: The repository's previous default branch, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
            repository:
              type: object
              description: Present for a renamed event
              properties:
                name:
                  description: "The repository's previous name, before this rename."
                  type: object
                  properties:
                    from:
                      description: The previous value, before this change.
                      type: string
            owner:
              type: object
              description: Present for a transferred event
              properties:
                from:
                  description: The previous value, before this change.
                  type: object
                  properties:
                    user:
                      $ref: '#/components/schemas/User'
                    organization:
                      $ref: '#/components/schemas/Organization'
        repository:
          $ref: '#/components/schemas/Repository'
        sender:
          $ref: '#/components/schemas/User'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    MemberPayload:
      type: object
      description: Payload for member events (repository collaborator activity)
      required:
        - action
        - member
        - sender
        - repository
      properties:
        action:
          description: "The action that was performed. Can be one of: edited, added, removed."
          type: string
          enum:
            - added
            - edited
            - removed
        member:
          $ref: '#/components/schemas/User'
          nullable: true
        changes:
          type: object
          description: For edited events, the changes to the member's permissions
          properties:
            old_permission:
              type: object
              description: The collaborator's previous permission level, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
            permission:
              type: object
              description: The collaborator's permission level change.
              properties:
                from:
                  type: string
                  description: The collaborator's permission level before this change.
                to:
                  type: string
                  description: The collaborator's permission level after this change.
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    # -----------------------------------------------------------------------
    # Batch 2 reusable sub-schemas
    # -----------------------------------------------------------------------

    Discussion:
      type: object
      description: A GitHub Discussion in a repository
      required:
        - id
        - number
        - title
        - state
      properties:
        id:
          description: "The unique identifier of the resource."
          type: integer
        node_id:
          description: "The GraphQL node ID."
          type: string
        number:
          description: "The discussion's number within the repository."
          type: integer
        title:
          type: string
          description: The discussion post's title.
        body:
          type: string
          nullable: true
          description: The discussion post's body text.
        state:
          type: string
          enum:
            - open
            - closed
            - converted
            - locked
          description: The current state of the discussion. `converting` means that the discussion is being converted from an issue. `transferring` means that the discussion is being transferred from another repository.
        category:
          $ref: '#/components/schemas/Category'
        user:
          $ref: '#/components/schemas/User'
        html_url:
          description: "The URL of the resource on GitHub.com."
          type: string
          format: uri
        comments:
          description: "The number of comments on the discussion."
          type: integer
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
          description: Color-coded labels categorizing the discussion.
        locked:
          description: "Whether the discussion is locked."
          type: boolean
        active_lock_reason:
          description: "The reason the discussion was locked, if applicable."
          type: string
          nullable: true
        answer_html_url:
          description: "The URL of the comment marked as the answer, if any."
          type: string
          nullable: true
        answer_chosen_at:
          description: "The date and time an answer was chosen, in ISO 8601 format."
          type: string
          format: date-time
          nullable: true
        answer_chosen_by:
          $ref: '#/components/schemas/User'
          nullable: true
        created_at:
          description: "The date and time the resource was created, in ISO 8601 format."
          type: string
          format: date-time
        updated_at:
          description: "The date and time the resource was last updated, in ISO 8601 format."
          type: string
          format: date-time

    Team:
      type: object
      description: A GitHub organization team
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: integer
          description: Unique identifier of the team.
        node_id:
          description: "The GraphQL node ID."
          type: string
        name:
          type: string
          description: Name of the team.
        slug:
          description: "The URL-friendly identifier of the resource."
          type: string
        description:
          type: string
          nullable: true
          description: Description of the team.
        privacy:
          description: "The level of privacy this team has (e.g. closed, secret)."
          type: string
          enum:
            - closed
            - secret
        notification_setting:
          type: string
          enum:
            - notifications_enabled
            - notifications_disabled
          description: Whether team members will receive notifications when their team is @mentioned.
        permission:
          type: string
          description: Permission that the team will have for its repositories.
        url:
          type: string
          format: uri
          description: URL for the team.
        html_url:
          description: "The URL of the resource on GitHub.com."
          type: string
          format: uri
        members_url:
          description: "The API URL listing the members of this team."
          type: string
        repositories_url:
          description: "The API URL listing the repositories associated with this resource."
          type: string
          format: uri
        parent:
          type: object
          nullable: true
          description: |
            A reduced "team-simple" shape, not a full Team - no nested parent (a team's parent
            is never itself nested further, avoiding unbounded recursion).
          required:
            - id
            - node_id
            - name
            - slug
            - type
          properties:
            id:
              type: integer
              description: Unique identifier of the team.
            node_id:
              description: "The GraphQL node ID."
              type: string
            url:
              type: string
              format: uri
              description: URL for the team.
            members_url:
              description: "The API URL listing the members of this team."
              type: string
            name:
              type: string
              description: Name of the team.
            description:
              type: string
              nullable: true
              description: Description of the team.
            permission:
              type: string
              description: Permission that the team will have for its repositories.
            privacy:
              type: string
              description: The level of privacy this team should have.
            notification_setting:
              type: string
              description: The notification setting the team has set.
            html_url:
              description: "The URL of the resource on GitHub.com."
              type: string
              format: uri
            repositories_url:
              description: "The API URL listing the repositories associated with this resource."
              type: string
              format: uri
            slug:
              description: "The URL-friendly identifier of the resource."
              type: string
            type:
              type: string
              enum:
                - enterprise
                - organization
              description: The ownership type of the team.
            organization_id:
              type: integer
              description: Unique identifier of the organization to which this team belongs.
            enterprise_id:
              type: integer

              description: Unique identifier of the enterprise to which this team belongs.
    # -----------------------------------------------------------------------
    # Batch 2 event payload schemas
    # -----------------------------------------------------------------------

    DiscussionPayload:
      type: object
      description: Payload for discussion events
      required:
        - action
        - discussion
      properties:
        action:
          description: "The action that was performed. Can be one of: created, edited, deleted, pinned, unpinned, locked, unlocked, transferred, category_changed, answered, unanswered, labeled, unlabeled, closed, reopened."
          type: string
          enum:
            - answered
            - category_changed
            - closed
            - created
            - deleted
            - edited
            - labeled
            - locked
            - pinned
            - reopened
            - transferred
            - unanswered
            - unlabeled
            - unlocked
            - unpinned
        discussion:
          $ref: '#/components/schemas/Discussion'
        answer:
          type: object
          description: |
            Present on answered action - the comment marked as answer. Richer than the
            Comment schema used for discussion_comment (has parent_id, child_comment_count,
            repository_url, discussion_id in addition to Comment's fields), so this is its
            own shape rather than a $ref to Comment.
          nullable: true
          properties:
            id:
              description: "The unique identifier of the resource."
              type: integer
            node_id:
              description: "The GraphQL node ID."
              type: string
            html_url:
              description: "The URL of the resource on GitHub.com."
              type: string
              format: uri
            parent_id:
              description: "The ID of the parent comment, if this is a reply; otherwise null."
              type: integer
              nullable: true
            child_comment_count:
              description: "The number of replies to this comment."
              type: integer
            repository_url:
              description: "The API URL of the repository this comment belongs to."
              type: string
              format: uri
            discussion_id:
              description: "The ID of the discussion this comment belongs to."
              type: integer
            author_association:
              type: string
              description: How the author is associated with the repository.
            user:
              $ref: '#/components/schemas/User'
            body:
              description: "The text of the comment."
              type: string
            created_at:
              description: "The date and time the resource was created, in ISO 8601 format."
              type: string
              format: date-time
            updated_at:
              description: "The date and time the resource was last updated, in ISO 8601 format."
              type: string
              format: date-time
        label:
          $ref: '#/components/schemas/Label'
        changes:
          type: object
          description: For edited/category_changed events, the changes made
          properties:
            title:
              type: object
              description: The discussion's previous title, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
            body:
              type: object
              description: The discussion's previous body text, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
            category:
              type: object
              description: Present on category_changed
              properties:
                from:
                  $ref: '#/components/schemas/Category'
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    DiscussionCommentPayload:
      type: object
      description: Payload for discussion_comment events
      required:
        - action
        - comment
        - discussion
      properties:
        action:
          description: "The action that was performed. Can be one of: created, edited, deleted."
          type: string
          enum:
            - created
            - deleted
            - edited
        comment:
          type: object
          description: The discussion comment
          properties:
            id:
              description: "The unique identifier of the resource."
              type: integer
            node_id:
              description: "The GraphQL node ID."
              type: string
            html_url:
              description: "The URL of the resource on GitHub.com."
              type: string
              format: uri
            body:
              description: "The text of the discussion comment."
              type: string
            user:
              $ref: '#/components/schemas/User'
            created_at:
              description: "The date and time the resource was created, in ISO 8601 format."
              type: string
              format: date-time
            updated_at:
              description: "The date and time the resource was last updated, in ISO 8601 format."
              type: string
              format: date-time
            author_association:
              type: string
              description: How the author is associated with the repository.
        discussion:
          $ref: '#/components/schemas/Discussion'
        changes:
          type: object
          description: For edited events, the changes to the comment
          properties:
            body:
              type: object
              description: The comment's previous body text, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    LabelPayload:
      type: object
      description: Payload for label events
      required:
        - action
        - label
        - sender
        - repository
      properties:
        action:
          description: "The action that was performed. Can be one of: created, edited, deleted."
          type: string
          enum:
            - created
            - deleted
            - edited
        label:
          $ref: '#/components/schemas/Label'
        changes:
          type: object
          description: For edited events, the changes to the label
          properties:
            color:
              type: object
              description: The label's previous color, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
            name:
              type: object
              description: The label's previous name, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
            description:
              type: object
              description: The label's previous description, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    MilestonePayload:
      type: object
      description: Payload for milestone events
      required:
        - action
        - milestone
        - sender
        - repository
      properties:
        action:
          description: "The action that was performed. Can be one of: created, edited, opened, deleted, closed."
          type: string
          enum:
            - closed
            - created
            - deleted
            - edited
            - opened
        milestone:
          $ref: '#/components/schemas/Milestone'
        changes:
          type: object
          description: For edited events, the changes to the milestone
          properties:
            description:
              type: object
              description: The milestone's previous description, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
            due_on:
              type: object
              description: The milestone's previous due date, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
                  format: date-time
                  nullable: true
            title:
              type: object
              description: The milestone's previous title, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    StatusPayload:
      type: object
      description: |
        Payload for status events. No action field — the state property carries
        the status (pending, success, failure, error).
      required:
        - id
        - sha
        - name
        - state
        - context
        - created_at
        - updated_at
        - commit
        - branches
        - sender
        - repository
      properties:
        id:
          type: integer
          description: The unique identifier of the status
        sha:
          type: string
          description: The commit SHA
        name:
          type: string
          description: The repository name
        state:
          type: string
          description: The new state of the commit status
          enum:
            - error
            - failure
            - pending
            - success
        context:
          type: string
          description: The status context identifier
        description:
          type: string
          nullable: true
          description: The optional human-readable description
        target_url:
          type: string
          nullable: true
          description: The optional link added to the status
        avatar_url:
          description: "The URL of the user's or organization's avatar image."
          type: string
          nullable: true
        commit:
          type: object
          description: The commit the status is associated with
          properties:
            sha:
              type: string
              description: The commit SHA.
            commit:
              type: object
              description: The raw git commit data (distinct from the GitHub account in the sibling author/committer fields)
              properties:
                author:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Name of the git user.
                    email:
                      type: string
                      description: Git email address of the user.
                    date:
                      type: string
                      format: date-time
                      description: Timestamp of the commit.
                  description: Identifying information for the git-user.
                committer:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Name of the git user.
                    email:
                      type: string
                      description: Git email address of the user.
                    date:
                      type: string
                      format: date-time
                      description: Timestamp of the commit.
                  description: Identifying information for the git-user.
                message:
                  type: string
                  description: Message describing the purpose of the commit.
                tree:
                  description: "A pointer to the Git tree object for a commit."
                  type: object
                  properties:
                    sha:
                      description: "The SHA of the Git tree object."
                      type: string
                    url:
                      description: "The API URL of the resource."
                      type: string
                      format: uri
                url:
                  description: "The API URL of the resource."
                  type: string
                  format: uri
                comment_count:
                  description: "The number of comments on the commit."
                  type: integer
                verification:
                  description: "GPG/SSH commit signature verification details."
                  type: object
                  properties:
                    verified:
                      description: "Whether the commit signature was successfully verified."
                      type: boolean
                    reason:
                      description: "The reason for the verification state, e.g. `valid`, `unsigned`, `bad_signature`."
                      type: string
                    signature:
                      description: "The signature that was extracted from the commit, or null if unsigned."
                      type: string
                      nullable: true
                    payload:
                      description: "The value that was signed, or null if unsigned."
                      type: string
                      nullable: true
            url:
              description: "The API URL of the resource."
              type: string
              format: uri
            html_url:
              description: "The URL of the resource on GitHub.com."
              type: string
              format: uri
            author:
              $ref: '#/components/schemas/User'
            committer:
              $ref: '#/components/schemas/User'
        branches:
          type: array
          description: Array of branches containing the status SHA (max 10)
          items:
            description: "A branch whose HEAD commit matches this status; at most 10 are included."
            type: object
            properties:
              name:
                description: "The name of the branch."
                type: string
              commit:
                description: "The commit at the tip of a branch (SHA and URL only)."
                type: object
                properties:
                  sha:
                    description: "The SHA of the commit."
                    type: string
                  url:
                    description: "The API URL of the resource."
                    type: string
                    format: uri
              protected:
                description: "Whether the branch has protection rules enabled."
                type: boolean
        created_at:
          description: "The date and time the resource was created, in ISO 8601 format."
          type: string
          format: date-time
        updated_at:
          description: "The date and time the resource was last updated, in ISO 8601 format."
          type: string
          format: date-time
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    WorkflowDispatchPayload:
      type: object
      description: Payload for workflow_dispatch events (manually triggered workflows)
      required:
        - ref
        - workflow
      properties:
        inputs:
          type: object
          nullable: true
          description: The inputs provided when manually triggering the workflow
          additionalProperties: true
        ref:
          type: string
          description: The branch or tag ref from which the workflow was triggered
        workflow:
          type: string
          description: The path to the workflow file (e.g. .github/workflows/main.yml)
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    PullRequestReviewThreadPayload:
      type: object
      description: Payload for pull_request_review_thread events
      required:
        - action
        - pull_request
        - thread
      properties:
        action:
          description: "The action that was performed. Can be one of: resolved, unresolved."
          type: string
          enum:
            - resolved
            - unresolved
        pull_request:
          $ref: '#/components/schemas/PullRequest'
        thread:
          type: object
          description: The review thread that was resolved or unresolved
          properties:
            node_id:
              description: "The GraphQL node ID."
              type: string
            comments:
              description: "The review comments in this conversation thread."
              type: array
              items:
                $ref: '#/components/schemas/PullRequestReviewComment'
        updated_at:
          description: "The date and time the resource was last updated, in ISO 8601 format."
          type: string
          format: date-time
          nullable: true
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    TeamPayload:
      type: object
      description: Payload for team events
      required:
        - action
        - team
      properties:
        action:
          description: "The action that was performed. Can be one of: created, deleted, edited, added_to_repository, removed_from_repository."
          type: string
          enum:
            - added_to_repository
            - created
            - deleted
            - edited
            - removed_from_repository
        team:
          $ref: '#/components/schemas/Team'
        changes:
          type: object
          description: For edited events, the changes to the team
          properties:
            description:
              type: object
              description: The team's previous description, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
            name:
              type: object
              description: The team's previous name, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
            privacy:
              type: object
              description: The team's previous privacy level, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
            notification_setting:
              type: object
              description: The team's previous notification setting, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
            repository:
              $ref: '#/components/schemas/Repository'
              description: For added_to_repository/removed_from_repository events
        repository:
          $ref: '#/components/schemas/Repository'
          description: Present for added_to_repository and removed_from_repository actions
        sender:
          $ref: '#/components/schemas/User'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    OrganizationPayload:
      type: object
      description: Payload for organization events
      required:
        - action
      properties:
        action:
          description: "The action that was performed. Can be one of: member_added, member_removed, member_invited, renamed, deleted."
          type: string
          enum:
            - deleted
            - member_added
            - member_invited
            - member_removed
            - renamed
        membership:
          type: object
          description: |
            The membership between the user and the organization.
            Not present when the action is member_invited.
          nullable: true
          properties:
            url:
              description: "The API URL of the resource."
              type: string
              format: uri
            state:
              type: string
              enum:
                - active
                - pending
              description: The state of the member in the organization. The `pending` state indicates the user has not yet accepted an invitation.
            role:
              type: string
              enum:
                - admin
                - member
                - billing_manager
              description: The user's membership type in the organization.
            organization_url:
              description: "The API URL of the organization."
              type: string
              format: uri
            user:
              $ref: '#/components/schemas/User'
        invitation:
          type: object
          nullable: true
          description: Present when action is member_invited
          required:
            - id
            - role
            - created_at
            - inviter
            - team_count
            - node_id
            - invitation_teams_url
          properties:
            id:
              description: "The unique identifier of the resource."
              type: integer
            login:
              description: "The username of the invited user, if known."
              type: string
              nullable: true
            email:
              description: "The email address of the invited user, if known."
              type: string
              nullable: true
            role:
              description: "The role assigned to the invited user, e.g. admin, direct_member, or billing_manager."
              type: string
            created_at:
              description: "The date and time the resource was created, in ISO 8601 format."
              type: string
              format: date-time
            failed_at:
              description: "The date and time the invitation failed, in ISO 8601 format, if applicable."
              type: string
              format: date-time
              nullable: true
            failed_reason:
              description: "The reason the invitation failed, if applicable."
              type: string
              nullable: true
            inviter:
              $ref: '#/components/schemas/User'
            team_count:
              description: "The number of teams the invitation grants membership to."
              type: integer
            node_id:
              description: "The GraphQL node ID."
              type: string
            invitation_teams_url:
              description: "The API URL listing the teams included in this invitation."
              type: string
              format: uri
            invitation_source:
              description: "The source through which the invitation was created, e.g. member or scim."
              type: string
              nullable: true
        changes:
          type: object
          nullable: true
          description: For renamed events, the old and new organization name
          properties:
            login:
              type: object
              description: The organization's previous login (name), before this rename.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
        sender:
          $ref: '#/components/schemas/User'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    DeploymentProtectionRulePayload:
      type: object
      description: Payload for deployment_protection_rule events (app webhooks only)
      properties:
        environment:
          type: string
          description: The name of the environment that has the deployment protection rule
        event:
          type: string
          description: The event that triggered the deployment protection rule
        sha:
          type: string
          description: The commit SHA that triggered the workflow
        ref:
          type: string
          description: The branch or tag ref that triggered the workflow
        deployment_callback_url:
          type: string
          format: uri
          description: The URL to call to approve or reject the deployment
        deployment:
          $ref: '#/components/schemas/Deployment'
          description: A request for a specific ref to be deployed
        pull_requests:
          type: array
          description: The pull requests associated with the deployment
          items:
            description: "A pull request associated with the deployment (number, URL, head and base refs)."
            type: object
            properties:
              number:
                description: "The pull request number."
                type: integer
              url:
                description: "The API URL of the resource."
                type: string
                format: uri
              head:
                $ref: '#/components/schemas/PullRequestRef'
              base:
                $ref: '#/components/schemas/PullRequestRef'
        sender:
          $ref: '#/components/schemas/User'
        installation:
          $ref: '#/components/schemas/Installation'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'

    # -----------------------------------------------------------------------
    # Batch 3 event payload schemas
    # -----------------------------------------------------------------------

    CommitCommentPayload:
      type: object
      description: Payload for commit_comment events
      required:
        - action
        - comment
      properties:
        action:
          description: "The action that was performed. Can be one of: created."
          type: string
          enum:
            - created
        comment:
          type: object
          description: The commit comment resource
          required:
            - id
            - body
          properties:
            id:
              description: "The unique identifier of the resource."
              type: integer
            node_id:
              description: "The GraphQL node ID."
              type: string
            url:
              description: "The API URL of the resource."
              type: string
              format: uri
            html_url:
              description: "The URL of the resource on GitHub.com."
              type: string
              format: uri
            body:
              description: "The contents of the comment."
              type: string
            path:
              type: string
              nullable: true
              description: The relative path of the file being commented on
            position:
              type: integer
              nullable: true
              description: The line index in the diff
            line:
              type: integer
              nullable: true
              description: The line of the blob the comment refers to
            commit_id:
              description: "The SHA of the commit the comment was made on."
              type: string
            user:
              $ref: '#/components/schemas/User'
            created_at:
              description: "The date and time the resource was created, in ISO 8601 format."
              type: string
              format: date-time
            updated_at:
              description: "The date and time the resource was last updated, in ISO 8601 format."
              type: string
              format: date-time
            author_association:
              type: string
              description: How the author is associated with the repository.
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    DependabotAlertPayload:
      type: object
      description: Payload for dependabot_alert events
      required:
        - action
        - alert
      properties:
        action:
          description: "The action that was performed. Can be one of: created, dismissed, reopened, reintroduced, fixed, auto_dismissed, auto_reopened, assignees_changed."
          type: string
          enum:
            - assignees_changed
            - auto_dismissed
            - auto_reopened
            - created
            - dismissed
            - fixed
            - reintroduced
            - reopened
        alert:
          type: object
          description: A Dependabot alert
          required:
            - number
            - state
          properties:
            number:
              type: integer
              description: The security alert number.
            state:
              type: string
              enum:
                - auto_dismissed
                - dismissed
                - fixed
                - open
              description: The state of the Dependabot alert.
            dependency:
              type: object
              properties:
                package:
                  $ref: '#/components/schemas/Package'
                manifest_path:
                  type: string
                  description: The full path to the dependency manifest file, relative to the root of the repository.
                scope:
                  type: string
                  enum:
                    - development
                    - runtime
                  nullable: true
                  description: The execution scope of the vulnerable dependency.
              description: Details for the vulnerable dependency.
            security_advisory:
              description: "Details for the GitHub Security Advisory linked to the alert."
              type: object
              properties:
                ghsa_id:
                  description: "The GitHub Security Advisory ID."
                  type: string
                cve_id:
                  description: "The CVE ID associated with the advisory, if any."
                  type: string
                  nullable: true
                summary:
                  description: "A short summary of the security advisory."
                  type: string
                description:
                  description: "A detailed description of the security advisory."
                  type: string
                severity:
                  description: "The severity of the advisory, e.g. low, medium, high, or critical."
                  type: string
                  enum:
                    - low
                    - medium
                    - high
                    - critical
                vulnerabilities:
                  description: "The list of package versions affected by this advisory."
                  type: array
                  items:
                    $ref: '#/components/schemas/SecurityVulnerability'
            security_vulnerability:
              $ref: '#/components/schemas/SecurityVulnerability'
            url:
              type: string
              format: uri
              description: The REST API URL of the alert resource.
            html_url:
              type: string
              format: uri
              description: The GitHub URL of the alert resource.
            created_at:
              type: string
              format: date-time
              description: "The time that the alert was created in ISO 8601 format: `YYYY-MM-DDTHH:MM:SSZ`."
            updated_at:
              type: string
              format: date-time
              description: "The time that the alert was last updated in ISO 8601 format: `YYYY-MM-DDTHH:MM:SSZ`."
            dismissed_at:
              type: string
              format: date-time
              nullable: true
              description: "The time that the alert was dismissed in ISO 8601 format: `YYYY-MM-DDTHH:MM:SSZ`."
            dismissed_by:
              $ref: '#/components/schemas/User'
              nullable: true
            dismissed_reason:
              type: string
              nullable: true
              description: The reason that the alert was dismissed.
            dismissed_comment:
              type: string
              nullable: true
              description: An optional comment associated with the alert's dismissal.
            fixed_at:
              type: string
              format: date-time
              nullable: true
              description: "The time that the alert was no longer detected and was considered fixed in ISO 8601 format: `YYYY-MM-DDTHH:MM:SSZ`."
            auto_dismissed_at:
              type: string
              format: date-time
              nullable: true
              description: "The time that the alert was auto-dismissed in ISO 8601 format: `YYYY-MM-DDTHH:MM:SSZ`."
            assignees:
              type: array
              items:
                $ref: '#/components/schemas/User'
              description: The users assigned to this alert.
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    GollumPayload:
      type: object
      description: Payload for gollum (wiki) events
      required:
        - pages
        - sender
        - repository
      properties:
        pages:
          type: array
          description: The pages that were updated
          items:
            description: "A wiki page that was created or updated."
            type: object
            required:
              - page_name
              - title
              - action
              - sha
              - html_url
            properties:
              page_name:
                type: string
                description: The name of the page
              title:
                type: string
                description: The current page title
              summary:
                type: string
                nullable: true
                description: A summary of the changes
              action:
                description: "The action performed on the page, either created or edited."
                type: string
                enum:
                  - created
                  - edited
              sha:
                type: string
                description: The latest commit SHA of the page
              html_url:
                description: "The URL of the resource on GitHub.com."
                type: string
                format: uri
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    InstallationPayload:
      type: object
      description: Payload for installation events
      required:
        - action
        - installation
      properties:
        action:
          description: "The action that was performed. Can be one of: created, deleted, suspend, unsuspend, new_permissions_accepted."
          type: string
          enum:
            - created
            - deleted
            - new_permissions_accepted
            - suspend
            - unsuspend
        installation:
          $ref: '#/components/schemas/Installation'
        repositories:
          type: array
          description: An array of repositories the installation can access
          items:
            description: "A minimal repository reference included in installation events."
            type: object
            properties:
              id:
                description: "The unique identifier of the resource."
                type: integer
              node_id:
                description: "The GraphQL node ID."
                type: string
              name:
                description: "The name of the repository."
                type: string
              full_name:
                description: "The full name of the repository, in the form `owner/repo`."
                type: string
              private:
                description: "Whether the repository is private."
                type: boolean
        requester:
          $ref: '#/components/schemas/User'
          nullable: true
        sender:
          $ref: '#/components/schemas/User'
        organization:
          $ref: '#/components/schemas/Organization'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    InstallationRepositoriesPayload:
      type: object
      description: Payload for installation_repositories events
      required:
        - action
        - repositories_added
        - repositories_removed
        - repository_selection
        - requester
      properties:
        action:
          description: "The action that was performed. Can be one of: added, removed."
          type: string
          enum:
            - added
            - removed
        repositories_added:
          type: array
          description: Repositories added to the installation
          items:
            description: "A repository added to a GitHub App installation."
            type: object
            properties:
              id:
                description: "The unique identifier of the resource."
                type: integer
              node_id:
                description: "The GraphQL node ID."
                type: string
              name:
                description: "The name of the repository."
                type: string
              full_name:
                description: "The full name of the repository, in owner/repo format."
                type: string
              private:
                description: "Whether the repository is private."
                type: boolean
        repositories_removed:
          type: array
          description: Repositories removed from the installation
          items:
            description: "A repository removed from a GitHub App installation."
            type: object
            properties:
              id:
                description: "The unique identifier of the resource."
                type: integer
              node_id:
                description: "The GraphQL node ID."
                type: string
              name:
                description: "The name of the repository."
                type: string
              full_name:
                description: "The full name of the repository, in owner/repo format."
                type: string
              private:
                description: "Whether the repository is private."
                type: boolean
        repository_selection:
          type: string
          description: Whether all repositories or a selection are accessible
          enum:
            - all
            - selected
        requester:
          $ref: '#/components/schemas/User'
          nullable: true
        installation:
          $ref: '#/components/schemas/Installation'
        sender:
          $ref: '#/components/schemas/User'
        organization:
          $ref: '#/components/schemas/Organization'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    MembershipPayload:
      type: object
      description: Payload for membership events (team member added/removed)
      required:
        - action
        - member
        - scope
        - team
      properties:
        action:
          description: "The action that was performed. Can be one of: added, removed."
          type: string
          enum:
            - added
            - removed
        member:
          $ref: '#/components/schemas/User'
          nullable: true
        scope:
          type: string
          description: The scope of the membership (currently always "team")
          enum:
            - team
        team:
          $ref: '#/components/schemas/Team'
        sender:
          $ref: '#/components/schemas/User'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    MergeGroupPayload:
      type: object
      description: Payload for merge_group events
      required:
        - action
        - merge_group
      properties:
        action:
          description: "The action that was performed. Can be one of: checks_requested, destroyed."
          type: string
          enum:
            - checks_requested
            - destroyed
        merge_group:
          type: object
          description: A group of pull requests grouped together by the merge queue
          required:
            - head_sha
            - head_ref
            - base_sha
            - base_ref
          properties:
            head_sha:
              type: string
              description: The SHA of the merge group's head commit
            head_ref:
              type: string
              description: The full ref of the merge group targeting branch
            base_sha:
              type: string
              description: The SHA of the merge group's base branch
            base_ref:
              type: string
              description: The full ref of the branch being merged into
            head_commit:
              $ref: '#/components/schemas/Commit'
        reason:
          type: string
          description: For destroyed action, the reason the merge group was destroyed
          nullable: true
          enum:
            - dequeued
            - invalidated
            - merged
            - rejected
            - 
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    PublicPayload:
      type: object
      description: |
        Payload for public events. Fired when a repository visibility changes
        from private to public. No action field.
      required:
        - sender
        - repository
      properties:
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    RepositoryDispatchPayload:
      type: object
      description: |
        Payload for repository_dispatch events. The action field matches the
        event_type provided in the POST /repos/{owner}/{repo}/dispatches request.
      required:
        - action
        - branch
        - client_payload
      properties:
        action:
          type: string
          description: The event_type specified in the dispatch request body
        branch:
          type: string
          description: The branch from which the dispatch was triggered
        client_payload:
          type: object
          nullable: true
          description: The client_payload from the dispatch request body
          additionalProperties: true
        installation:
          $ref: '#/components/schemas/Installation'
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    SecretScanningAlertPayload:
      type: object
      description: Payload for secret_scanning_alert events
      required:
        - action
        - alert
      properties:
        action:
          description: "The action that was performed. Can be one of: assigned, reopened, unassigned, created, publicly_leaked, validated, resolved."
          type: string
          enum:
            - assigned
            - created
            - publicly_leaked
            - reopened
            - resolved
            - unassigned
            - validated
        alert:
          type: object
          description: The secret scanning alert
          required:
            - number
            - state
          properties:
            number:
              type: integer
              description: The security alert number.
            created_at:
              type: string
              format: date-time
              description: "The time that the alert was created in ISO 8601 format: `YYYY-MM-DDTHH:MM:SSZ`."
            updated_at:
              type: string
              format: date-time
              nullable: true
              description: "The time that the alert was last updated in ISO 8601 format: `YYYY-MM-DDTHH:MM:SSZ`."
            url:
              type: string
              format: uri
              description: The REST API URL of the alert resource.
            html_url:
              type: string
              format: uri
              description: The GitHub URL of the alert resource.
            locations_url:
              type: string
              format: uri
              description: The REST API URL of the code locations for this alert.
            state:
              description: "The state of the secret scanning alert. Can be open or resolved."
              type: string
              enum:
                - open
                - resolved
            resolution:
              type: string
              nullable: true
              enum:
                - false_positive
                - 
                - pattern_deleted
                - pattern_edited
                - revoked
                - used_in_tests
                - wont_fix
              description: The reason for resolving the alert.
            resolved_at:
              type: string
              format: date-time
              nullable: true
              description: "The time that the alert was resolved in ISO 8601 format: `YYYY-MM-DDTHH:MM:SSZ`."
            resolved_by:
              $ref: '#/components/schemas/User'
              nullable: true
            resolution_comment:
              type: string
              nullable: true
              description: An optional comment to resolve an alert.
            secret_type:
              type: string
              description: The type of secret that was detected
            secret_type_display_name:
              type: string
              description: User-friendly name for the detected secret, matching the `secret_type`.
            validity:
              type: string
              enum:
                - active
                - inactive
                - unknown
              description: The token status as of the latest validity check.
            publicly_leaked:
              type: boolean
              description: Whether the detected secret was publicly leaked.
            multi_repo:
              type: boolean
              description: Whether the detected secret was found in multiple repositories under the same organization or enterprise.
            push_protection_bypassed:
              type: boolean
              nullable: true
              description: Whether push protection was bypassed for the detected secret.
            push_protection_bypassed_by:
              $ref: '#/components/schemas/User'
              nullable: true
            push_protection_bypassed_at:
              type: string
              format: date-time
              nullable: true
              description: "The time that push protection was bypassed in ISO 8601 format: `YYYY-MM-DDTHH:MM:SSZ`."
        assignee:
          $ref: '#/components/schemas/User'
          description: Present on assigned/unassigned actions
          nullable: true
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    # -----------------------------------------------------------------------
    # Batch 4 event payload schemas
    # -----------------------------------------------------------------------

    BranchProtectionRulePayload:
      type: object
      description: Payload for branch_protection_rule events
      required:
        - action
        - rule
      properties:
        action:
          description: "The action that was performed. Can be one of: created, edited, deleted."
          type: string
          enum:
            - created
            - deleted
            - edited
        rule:
          type: object
          description: |
            The branch protection rule. Includes name and all branch protection
            settings applied to matching branches. Binary settings are boolean;
            multi-level configs are off, non_admins, or everyone; actor and
            build lists are arrays of strings.
          properties:
            id:
              type: integer
              description: The branch protection rule's database ID.
            repository_id:
              type: integer
              description: The ID of the repository the rule applies to.
            name:
              type: string
              description: The name of the branch, or branch name pattern, the rule applies to.
            created_at:
              type: string
              format: date-time
              description: The time the branch protection rule was created, in ISO 8601 format.
            updated_at:
              type: string
              format: date-time
              description: The time the branch protection rule was last updated, in ISO 8601 format.
            pull_request_reviews_enforcement_level:
              type: string
              enum: ["off", non_admins, everyone]
              description: Enforcement level for requiring an approving pull request review before merging.
            required_approving_review_count:
              type: integer
              description: The number of approving reviews required on a pull request before merging.
            dismiss_stale_reviews_on_push:
              type: boolean
              description: Whether approving reviews are automatically dismissed when someone pushes a new commit.
            require_code_owner_review:
              type: boolean
              description: Whether pull requests are blocked from merging until code owners review them.
            authorized_dismissal_actors_only:
              type: boolean
              description: Whether only specific users, teams, or apps can dismiss pull request reviews.
            ignore_approvals_from_contributors:
              type: boolean
              description: Whether approvals from contributors who have also pushed to the branch are ignored when counting required approvals.
            require_last_push_approval:
              type: boolean
              description: Whether the most recent push to the pull request must be approved by someone other than whoever pushed it.
            required_status_checks:
              type: array
              items:
                type: string
              description: The list of status checks that must pass before merging into the branch.
            required_status_checks_enforcement_level:
              type: string
              enum: ["off", non_admins, everyone]
              description: Enforcement level for required status checks.
            strict_required_status_checks_policy:
              type: boolean
              description: Whether branches must be up to date with the base branch before merging.
            signature_requirement_enforcement_level:
              type: string
              enum: ["off", non_admins, everyone]
              description: Enforcement level for requiring signed commits.
            linear_history_requirement_enforcement_level:
              type: string
              enum: ["off", non_admins, everyone]
              description: Enforcement level for requiring a linear commit history.
            admin_enforced:
              type: boolean
              description: Whether the branch protection rule's restrictions are also enforced for repository administrators.
            allow_force_pushes_enforcement_level:
              type: string
              enum: ["off", non_admins, everyone]
              description: Enforcement level for permitting force pushes to matching branches.
            allow_deletions_enforcement_level:
              type: string
              enum: ["off", non_admins, everyone]
              description: Enforcement level for permitting deletion of matching branches.
            merge_queue_enforcement_level:
              type: string
              enum: ["off", non_admins, everyone]
              description: Enforcement level for requiring merges to go through a merge queue.
            required_deployments_enforcement_level:
              type: string
              enum: ["off", non_admins, everyone]
              description: Enforcement level for requiring successful deployments to specific environments before merging.
            required_conversation_resolution_level:
              type: string
              enum: ["off", non_admins, everyone]
              description: Enforcement level for requiring all pull request conversations to be resolved before merging.
            authorized_actors_only:
              type: boolean
              description: Whether only specific users, teams, or apps can push to the branch.
            authorized_actor_names:
              type: array
              items:
                type: string
              description: The names of the users, teams, or apps authorized to push to the branch.
        changes:
          type: object
          description: For edited events, the changes to the rule - one entry per changed setting, each wrapped in "from"
          properties:
            pull_request_reviews_enforcement_level:
              type: object
              description: The rule's previous pull request review enforcement level, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
            required_approving_review_count:
              type: object
              description: The rule's previous required approving review count, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: integer
            dismiss_stale_reviews_on_push:
              type: object
              description: The rule's previous dismiss-stale-reviews-on-push setting, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: boolean
            require_code_owner_review:
              type: object
              description: The rule's previous require-code-owner-review setting, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: boolean
            authorized_dismissal_actors_only:
              type: object
              description: The rule's previous authorized-dismissal-actors-only setting, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: boolean
            ignore_approvals_from_contributors:
              type: object
              description: The rule's previous ignore-approvals-from-contributors setting, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: boolean
            require_last_push_approval:
              type: object
              description: The rule's previous require-last-push-approval setting, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: boolean
            required_status_checks:
              type: object
              description: The rule's previous list of required status checks, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: array
                  items:
                    type: string
            required_status_checks_enforcement_level:
              type: object
              description: The rule's previous required status checks enforcement level, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
            strict_required_status_checks_policy:
              type: object
              description: The rule's previous strict required status checks policy setting, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: boolean
            signature_requirement_enforcement_level:
              type: object
              description: The rule's previous signature requirement enforcement level, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
            linear_history_requirement_enforcement_level:
              type: object
              description: The rule's previous linear history requirement enforcement level, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
            admin_enforced:
              type: object
              description: The rule's previous admin-enforced setting, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: boolean
            allow_force_pushes_enforcement_level:
              type: object
              description: The rule's previous allow-force-pushes enforcement level, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
            allow_deletions_enforcement_level:
              type: object
              description: The rule's previous allow-deletions enforcement level, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
            merge_queue_enforcement_level:
              type: object
              description: The rule's previous merge queue enforcement level, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
            required_deployments_enforcement_level:
              type: object
              description: The rule's previous required deployments enforcement level, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
            required_conversation_resolution_level:
              type: object
              description: The rule's previous required conversation resolution enforcement level, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
            authorized_actors_only:
              type: object
              description: The rule's previous authorized-actors-only setting, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: boolean
            authorized_actor_names:
              type: object
              description: The rule's previous list of authorized actor names, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: array
                  items:
                    type: string
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    CodeScanningAlertPayload:
      type: object
      description: Payload for code_scanning_alert events
      required:
        - action
        - alert
        - commit_oid
        - ref
      properties:
        action:
          description: "The action that was performed. Can be one of: appeared_in_branch, closed_by_user, created, fixed, reopened, reopened_by_user, updated_assignment."
          type: string
          enum:
            - appeared_in_branch
            - closed_by_user
            - created
            - fixed
            - reopened
            - reopened_by_user
            - updated_assignment
        alert:
          type: object
          description: The code scanning alert involved in the event
          required:
            - number
            - state
          properties:
            number:
              type: integer
              description: The security alert number.
            created_at:
              type: string
              format: date-time
              description: "The time that the alert was created in ISO 8601 format: `YYYY-MM-DDTHH:MM:SSZ`."
            updated_at:
              type: string
              format: date-time
              nullable: true
              description: "The time that the alert was last updated in ISO 8601 format: `YYYY-MM-DDTHH:MM:SSZ`."
            url:
              type: string
              format: uri
              description: The REST API URL of the alert resource.
            html_url:
              type: string
              format: uri
              description: The GitHub URL of the alert resource.
            state:
              type: string
              enum:
                - open
                - closed
                - dismissed
                - fixed
              description: State of a code scanning alert.
            fixed_at:
              type: string
              format: date-time
              nullable: true
              description: "The time that the alert was no longer detected and was considered fixed in ISO 8601 format: `YYYY-MM-DDTHH:MM:SSZ`."
            dismissed_by:
              $ref: '#/components/schemas/User'
              nullable: true
            dismissed_at:
              type: string
              format: date-time
              nullable: true
              description: "The time that the alert was dismissed in ISO 8601 format: `YYYY-MM-DDTHH:MM:SSZ`."
            dismissed_reason:
              type: string
              nullable: true
              enum:
                - false positive
                - used in tests
                - won't fix
                - 
              description: The reason for dismissing or closing the alert.
            dismissed_comment:
              type: string
              nullable: true
              description: The dismissal comment associated with the dismissal of the alert.
            rule:
              description: "The rule that triggered the code scanning alert."
              type: object
              properties:
                id:
                  description: "The unique identifier of the resource."
                  type: string
                severity:
                  description: "The severity of the alert, e.g. note, warning, or error."
                  type: string
                  enum: [error, warning, note, none]
                security_severity_level:
                  description: "The security severity level of the alert, e.g. low, medium, high, or critical."
                  type: string
                  nullable: true
                  enum: [critical, high, medium, low, "null"]
                description:
                  description: "A short description of the rule."
                  type: string
                name:
                  description: "The name of the rule."
                  type: string
                full_description:
                  description: "The full description of the rule."
                  type: string
                tags:
                  description: "Tags associated with the rule."
                  type: array
                  items:
                    type: string
                help:
                  description: "Help text describing how to fix the issue."
                  type: string
                  nullable: true
            tool:
              description: "The tool that generated the code scanning alert."
              type: object
              properties:
                name:
                  description: "The name of the tool."
                  type: string
                guid:
                  description: "The GUID of the tool."
                  type: string
                  nullable: true
                version:
                  description: "The version of the tool."
                  type: string
                  nullable: true
            most_recent_instance:
              description: "The most recent instance of the code scanning alert."
              type: object
              properties:
                ref:
                  description: "The full Git reference, formatted as `refs/heads/<branch name>`."
                  type: string
                analysis_key:
                  description: "Identifies the configuration under which the analysis was executed, e.g. workflow and job name."
                  type: string
                environment:
                  description: "Identifies the variable values of the environment the analysis was performed in, e.g. the language analyzed."
                  type: string
                state:
                  description: "The state of the alert instance. Can be one of: open, dismissed, fixed."
                  type: string
                commit_sha:
                  description: "The SHA of the commit this alert instance was found in."
                  type: string
                location:
                  type: object
                  description: |
                    Where in the code this alert instance was found - unrelated to, and a
                    different shape from, secret_scanning's own "location" field elsewhere in
                    this spec (that one identifies a commit/path, this one a line/column range).
                  properties:
                    path:
                      description: "The file path where the flagged code is located."
                      type: string
                    start_line:
                      description: "The line number where the flagged code range begins."
                      type: integer
                    end_line:
                      description: "The line number where the flagged code range ends."
                      type: integer
                    start_column:
                      description: "The column number where the flagged code range begins."
                      type: integer
                    end_column:
                      description: "The column number where the flagged code range ends."
                      type: integer
        commit_oid:
          type: string
          description: |
            The commit SHA of the alert. Empty when action is reopened_by_user
            or closed_by_user.
        ref:
          type: string
          description: |
            The git ref of the alert. Empty when action is reopened_by_user
            or closed_by_user.
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    DeployKeyPayload:
      type: object
      description: Payload for deploy_key events
      required:
        - action
        - key
      properties:
        action:
          description: "The action that was performed. Can be one of: created, deleted."
          type: string
          enum:
            - created
            - deleted
        key:
          type: object
          description: The deploy key resource
          required:
            - id
            - key
          properties:
            id:
              description: "The unique identifier of the resource."
              type: integer
            key:
              type: string
              description: The public key
            url:
              description: "The API URL of the resource."
              type: string
              format: uri
            title:
              description: "The user-supplied label for the deploy key."
              type: string
            verified:
              description: "Whether GitHub has verified the deploy key."
              type: boolean
            created_at:
              description: "The date and time the resource was created, in ISO 8601 format."
              type: string
              format: date-time
            read_only:
              description: "Whether the deploy key has read-only (not read-write) access."
              type: boolean
            added_by:
              description: "The username of the user who added the deploy key, if known."
              type: string
              nullable: true
            last_used:
              description: "The date and time the deploy key was last used, in ISO 8601 format."
              type: string
              format: date-time
              nullable: true
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    GithubAppAuthorizationPayload:
      type: object
      description: Payload for github_app_authorization events (app webhooks only)
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - revoked
          description: Always revoked — a user revoked their GitHub App authorization
        sender:
          $ref: '#/components/schemas/User'
        installation:
          $ref: '#/components/schemas/Installation'

    MetaPayload:
      type: object
      description: Payload for meta events (webhook lifecycle)
      required:
        - action
        - hook_id
        - hook
      properties:
        action:
          type: string
          enum:
            - deleted
          description: Always deleted — the webhook that triggered this event was deleted
        hook_id:
          type: integer
          description: The id of the modified webhook
        hook:
          type: object
          description: |
            The deleted webhook. Fields vary by webhook type (repository,
            organization, business, app, or GitHub Marketplace).
          required:
            - type
            - id
            - name
            - active
          properties:
            type:
              description: "The type of resource the webhook is attached to, e.g. Repository, Organization, App, Business."
              type: string
              enum:
                - Repository
                - Organization
                - Business
                - App
                - Marketplace
            id:
              type: integer
              description: Unique identifier of the webhook.
            name:
              type: string
              description: The name of a valid service, use 'web' for a webhook.
            active:
              type: boolean
              description: Determines whether the hook is actually triggered on pushes.
            events:
              type: array
              items:
                type: string
              description: "Determines what events the hook is triggered for. Default: ['push']."
            config:
              description: "The webhook's delivery configuration (URL, content type, SSL verification)."
              type: object
              properties:
                content_type:
                  description: "The media type used to serialize the payloads, e.g. `json` or `form`."
                  type: string
                  enum: [json, form]
                insecure_ssl:
                  description: "Whether SSL certificate verification is skipped when delivering payloads."
                  type: string
                url:
                  description: "The URL to which the payloads will be delivered."
                  type: string
                  format: uri
                secret:
                  type: string
                  description: Omitted from payloads for security
            updated_at:
              description: "The date and time the resource was last updated, in ISO 8601 format."
              type: string
              format: date-time
            created_at:
              description: "The date and time the resource was created, in ISO 8601 format."
              type: string
              format: date-time
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    OrgBlockPayload:
      type: object
      description: Payload for org_block events
      required:
        - action
        - blocked_user
      properties:
        action:
          description: "The action that was performed. Can be one of: blocked, unblocked."
          type: string
          enum:
            - blocked
            - unblocked
        blocked_user:
          $ref: '#/components/schemas/User'
          nullable: true
        sender:
          $ref: '#/components/schemas/User'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    PackagePayload:
      type: object
      description: Payload for package events (GitHub Packages)
      required:
        - action
        - package
      properties:
        action:
          description: "The action that was performed. Can be one of: published, updated."
          type: string
          enum:
            - published
            - updated
        package:
          type: object
          description: Information about the package
          required:
            - id
            - name
          properties:
            id:
              type: integer
              description: Unique identifier of the package.
            name:
              type: string
              description: The name of the package.
            namespace:
              description: "The namespace of the package, e.g. npm scope or repository owner."
              type: string
            description:
              description: "A short description of the package."
              type: string
              nullable: true
            ecosystem:
              description: "The package ecosystem (e.g. npm, docker, maven, nuget, rubygems)."
              type: string
            package_type:
              type: string
              enum:
                - container
                - docker
                - maven
                - npm
                - nuget
                - rubygems
              description: "The package registry type, e.g. maven, container, docker, npm, nuget, or rubygems."
            html_url:
              description: "The URL of the resource on GitHub.com."
              type: string
              format: uri
            created_at:
              description: "The date and time the resource was created, in ISO 8601 format."
              type: string
              format: date-time
            updated_at:
              description: "The date and time the resource was last updated, in ISO 8601 format."
              type: string
              format: date-time
            owner:

          $ref: '#/components/schemas/Enterprise'

    RepositoryRulesetPayload:
      type: object
      description: Payload for repository_ruleset events
      required:
        - action
        - repository_ruleset
      properties:
        action:
          description: "The action that was performed. Can be one of: created, edited, deleted."
          type: string
          enum:
            - created
            - deleted
            - edited
        repository_ruleset:
          type: object
          description: A set of rules to apply when specified conditions are met
          required:
            - id
            - name
            - enforcement
          properties:
            id:
              type: integer
              description: The ID of the ruleset.
            name:
              type: string
              description: The name of the ruleset.
            target:
              type: string
              nullable: true
              enum:
                - branch
                - tag
                - push
              description: The target of the ruleset.
            source_type:
              type: string
              nullable: true
              enum:
                - Repository
                - Organization
              description: The type of the source of the ruleset.
            source:
              type: string
              description: The name of the source.
            enforcement:
              type: string
              enum:
                - disabled
                - active
                - evaluate
              description: The enforcement level of the ruleset. `evaluate` allows admins to test rules before enforcing them and view insights on the Rule Insights page (Enterprise only).
            conditions:
              type: object
              nullable: true
              description: Which refs this ruleset applies to
              properties:
                ref_name:
                  type: object
                  properties:
                    include:
                      type: array
                      items:
                        type: string
                      description: Array of ref names or patterns to include. One of these patterns must match for the condition to pass. Also accepts `~DEFAULT_BRANCH` to include the default branch or `~ALL` to include all branches.
                    exclude:
                      type: array
                      items:
                        type: string
                      description: Array of ref names or patterns to exclude. The condition will not pass if any of these patterns match.
                  description: Parameters for a repository ruleset ref name condition.
            rules:
              type: array
              description: |
                Each entry's real shape depends on its "type" - 20 real rule types confirmed
                against github/rest-api-description's authoritative OpenAPI spec (the actual
                source powering docs.github.com and every GitHub SDK), not guessed from field
                names or a third-party summary.
              items:
                description: "One rule in a ruleset; shape depends on its `type` discriminator."
                oneOf:
                  - type: object
                    description: Only allow users with bypass permission to create matching refs.
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [creation]
                        description: The rule type - always `creation`.
                  - type: object
                    description: Only allow users with bypass permission to update matching refs.
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [update]
                        description: The rule type - always `update`.
                      parameters:
                        type: object
                        description: Parameters for the `update` rule.
                        required: [update_allows_fetch_and_merge]
                        properties:
                          update_allows_fetch_and_merge:
                            type: boolean
                            description: Branch can pull changes from its upstream repository
                  - type: object
                    description: Only allow users with bypass permissions to delete matching refs.
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [deletion]
                        description: The rule type - always `deletion`.
                  - type: object
                    description: Prevent merge commits from being pushed to matching refs.
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [required_linear_history]
                        description: The rule type - always `required_linear_history`.
                  - type: object
                    description: Merges must be performed via a merge queue.
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [merge_queue]
                        description: The rule type - always `merge_queue`.
                      parameters:
                        type: object
                        description: Parameters for the `merge_queue` rule.
                        required:
                          - check_response_timeout_minutes
                          - grouping_strategy
                          - max_entries_to_build
                          - max_entries_to_merge
                          - merge_method
                          - min_entries_to_merge
                          - min_entries_to_merge_wait_minutes
                        properties:
                          check_response_timeout_minutes:
                            type: integer
                            description: Maximum time (minutes) for a required status check to report a conclusion. After this much time has elapsed, checks that have not reported a conclusion will be assumed to have failed.
                          grouping_strategy:
                            type: string
                            enum: [ALLGREEN, HEADGREEN]
                            description: When set to ALLGREEN, the merge commit created by merge queue for each PR in the group must pass all required checks to merge. When set to HEADGREEN, only the commit at the head of the merge group must pass its required checks to merge.
                          max_entries_to_build:
                            type: integer
                            description: Limit the number of queued pull requests requesting checks and workflow runs at the same time.
                          max_entries_to_merge:
                            type: integer
                            description: The maximum number of PRs that will be merged together in a group.
                          merge_method:
                            type: string
                            enum: [MERGE, SQUASH, REBASE]
                            description: Method to use when merging changes from queued pull requests.
                          min_entries_to_merge:
                            type: integer
                            description: The minimum number of PRs that will be merged together in a group.
                          min_entries_to_merge_wait_minutes:
                            type: integer
                            description: The time merge queue should wait after the first PR is added to the queue for the minimum group size to be met, before merging a smaller group.
                  - type: object
                    description: Choose which environments must be successfully deployed to before refs can be pushed.
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [required_deployments]
                        description: The rule type - always `required_deployments`.
                      parameters:
                        type: object
                        description: Parameters for the `required_deployments` rule.
                        required: [required_deployment_environments]
                        properties:
                          required_deployment_environments:
                            type: array
                            items:
                              type: string
                            description: Environments that must be successfully deployed to before branches can be merged.
                  - type: object
                    description: Commits pushed to matching refs must have verified signatures.
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [required_signatures]
                        description: The rule type - always `required_signatures`.
                  - type: object
                    description: Require commits be submitted via a pull request before they can be merged.
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [pull_request]
                        description: The rule type - always `pull_request`.
                      parameters:
                        type: object
                        description: Parameters for the `pull_request` rule.
                        required:
                          - dismiss_stale_reviews_on_push
                          - require_code_owner_review
                          - require_last_push_approval
                          - required_approving_review_count
                          - required_review_thread_resolution
                        properties:
                          allowed_merge_methods:
                            type: array
                            items:
                              type: string
                              enum: [merge, squash, rebase]
                            description: Array of allowed merge methods. At least one option must be enabled.
                          dismiss_stale_reviews_on_push:
                            type: boolean
                            description: New, reviewable commits pushed will dismiss previous pull request review approvals.
                          dismissal_restriction:
                            $ref: '#/components/schemas/RuleDismissalRestriction'
                          require_code_owner_review:
                            type: boolean
                            description: Require an approving review in pull requests that modify files that have a designated code owner.
                          require_last_push_approval:
                            type: boolean
                            description: Whether the most recent reviewable push must be approved by someone other than the person who pushed it.
                          required_approving_review_count:
                            type: integer
                            description: The number of approving reviews that are required before a pull request can be merged.
                          required_review_thread_resolution:
                            type: boolean
                            description: All conversations on code must be resolved before a pull request can be merged.
                          required_reviewers:
                            type: array
                            items:
                              $ref: '#/components/schemas/RuleRequiredReviewerConfiguration'
                            description: A collection of reviewers and associated file patterns. Each reviewer has a list of file patterns which determine the files that reviewer is required to review.
                  - type: object
                    description: Choose which status checks must pass before the ref is updated.
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [required_status_checks]
                        description: The rule type - always `required_status_checks`.
                      parameters:
                        type: object
                        description: Parameters for the `required_status_checks` rule.
                        required:
                          - required_status_checks
                          - strict_required_status_checks_policy
                        properties:
                          do_not_enforce_on_create:
                            type: boolean
                            description: Allow repositories and branches to be created if a check would otherwise prohibit it.
                          required_status_checks:
                            type: array
                            items:
                              $ref: '#/components/schemas/RuleStatusCheckConfiguration'
                            description: Status checks that are required.
                          strict_required_status_checks_policy:
                            type: boolean
                            description: Whether pull requests targeting a matching branch must be tested with the latest code. Has no effect unless at least one status check is enabled.
                  - type: object
                    description: Prevent users with push access from force pushing to refs.
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [non_fast_forward]
                        description: The rule type - always `non_fast_forward`.
                  - type: object
                    description: Restrict commit messages matching a pattern.
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [commit_message_pattern]
                        description: The rule type - always `commit_message_pattern`.
                      parameters:
                        $ref: '#/components/schemas/RulePatternParameters'
                  - type: object
                    description: Restrict commit author emails matching a pattern.
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [commit_author_email_pattern]
                        description: The rule type - always `commit_author_email_pattern`.
                      parameters:
                        $ref: '#/components/schemas/RulePatternParameters'
                  - type: object
                    description: Restrict committer emails matching a pattern.
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [committer_email_pattern]
                        description: The rule type - always `committer_email_pattern`.
                      parameters:
                        $ref: '#/components/schemas/RulePatternParameters'
                  - type: object
                    description: Restrict branch names matching a pattern.
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [branch_name_pattern]
                        description: The rule type - always `branch_name_pattern`.
                      parameters:
                        $ref: '#/components/schemas/RulePatternParameters'
                  - type: object
                    description: Restrict tag names matching a pattern.
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [tag_name_pattern]
                        description: The rule type - always `tag_name_pattern`.
                      parameters:
                        $ref: '#/components/schemas/RulePatternParameters'
                  - type: object
                    description: Restrict file and folder paths from being pushed.
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [file_path_restriction]
                        description: The rule type - always `file_path_restriction`.
                      parameters:
                        type: object
                        description: Parameters for the `file_path_restriction` rule.
                        required: [restricted_file_paths]
                        properties:
                          restricted_file_paths:
                            type: array
                            items:
                              type: string
                            description: File paths that are restricted from being pushed to the commit graph.
                  - type: object
                    description: Restrict file paths exceeding a character limit.
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [max_file_path_length]
                        description: The rule type - always `max_file_path_length`.
                      parameters:
                        type: object
                        description: Parameters for the `max_file_path_length` rule.
                        required: [max_file_path_length]
                        properties:
                          max_file_path_length:
                            type: integer
                            description: The maximum amount of characters allowed in file paths.
                  - type: object
                    description: Restrict files with specified file extensions.
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [file_extension_restriction]
                        description: The rule type - always `file_extension_restriction`.
                      parameters:
                        type: object
                        description: Parameters for the `file_extension_restriction` rule.
                        required: [restricted_file_extensions]
                        properties:
                          restricted_file_extensions:
                            type: array
                            items:
                              type: string
                            description: File extensions that are restricted from being pushed to the commit graph.
                  - type: object
                    description: Restrict individual files exceeding a size limit (MB).
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [max_file_size]
                        description: The rule type - always `max_file_size`.
                      parameters:
                        type: object
                        description: Parameters for the `max_file_size` rule.
                        required: [max_file_size]
                        properties:
                          max_file_size:
                            type: integer
                            description: The maximum file size allowed in megabytes.
                  - type: object
                    description: Require specified workflows to pass before changes can be merged.
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [workflows]
                        description: The rule type - always `workflows`.
                      parameters:
                        type: object
                        description: Parameters for the `workflows` rule.
                        required: [workflows]
                        properties:
                          do_not_enforce_on_create:
                            type: boolean
                            description: Allow repositories and branches to be created if a check would otherwise prohibit it.
                          workflows:
                            type: array
                            items:
                              $ref: '#/components/schemas/RuleWorkflowFileReference'
                            description: Workflows that must pass for this rule to pass.
                  - type: object
                    description: Choose which code scanning tools must provide results before the reference is updated.
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [code_scanning]
                        description: The rule type - always `code_scanning`.
                      parameters:
                        type: object
                        description: Parameters for the `code_scanning` rule.
                        required: [code_scanning_tools]
                        properties:
                          code_scanning_tools:
                            type: array
                            items:
                              $ref: '#/components/schemas/RuleCodeScanningTool'
                            description: Tools that must provide code scanning results for this rule to pass.
            bypass_actors:
              type: array
              items:
                description: "An actor permitted to bypass this ruleset's rules."
                type: object
                properties:
                  actor_id:
                    description: "The ID of the actor that can bypass this ruleset."
                    type: integer
                    nullable: true
                  actor_type:
                    description: "The type of actor that can bypass this ruleset, e.g. Team or OrganizationAdmin."
                    type: string
                    enum:
                      - DeployKey
                      - Integration
                      - OrganizationAdmin
                      - RepositoryRole
                      - Team
                  bypass_mode:
                    description: "When the actor can bypass this ruleset, e.g. always or pull_request."
                    type: string
                    enum:
                      - always
                      - pull_request
              description: The actors that can bypass the rules in this ruleset.
            created_at:

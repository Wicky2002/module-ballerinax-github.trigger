    RepositoryAdvisoryPayload:
      type: object
      description: Payload for repository_advisory events
      required:
        - action
        - repository_advisory
      properties:
        action:
          description: "The action that was performed. Can be one of: reported, published."
          type: string
          enum:
            - published
            - reported
        repository_advisory:
          type: object
          description: A repository security advisory
          required:
            - ghsa_id
            - cve_id
            - summary
            - severity
            - state
          properties:
            ghsa_id:
              type: string
              description: The GitHub Security Advisory identifier
            cve_id:
              type: string
              nullable: true
              description: The Common Vulnerabilities and Exposures (CVE) ID.
            url:
              type: string
              format: uri
              description: The API URL for the advisory.
            html_url:
              type: string
              format: uri
              description: The URL for the advisory.
            summary:
              type: string
              description: A short summary of the advisory.
            description:
              type: string
              nullable: true
              description: A detailed description of what the advisory entails.
            severity:
              type: string
              enum:
                - critical
                - high
                - medium
                - low
                - unknown
              description: The severity of the advisory.
            author:
              $ref: '#/components/schemas/User'
            publisher:
              $ref: '#/components/schemas/User'
              nullable: true
            identifiers:
              description: "The CVE and/or GHSA identifiers for the advisory."
              type: array
              items:
                description: "A CVE or GHSA identifier for the advisory."
                type: object
                properties:
                  type:
                    description: "The type of identifier, e.g. CVE or GHSA."
                    type: string
                    enum: [CVE, GHSA]
                  value:
                    description: "The identifier value."
                    type: string
            state:
              type: string
              enum:
                - draft
                - published
                - triage
                - withdrawn
              description: The state of the advisory.
            created_at:
              type: string
              format: date-time
              description: The date and time of when the advisory was created, in ISO 8601 format.
            updated_at:
              type: string
              format: date-time
              description: The date and time of when the advisory was last updated, in ISO 8601 format.
            published_at:
              type: string
              format: date-time
              nullable: true
              description: The date and time of when the advisory was published, in ISO 8601 format.
            withdrawn_at:
              type: string
              format: date-time
              nullable: true
              description: The date and time of when the advisory was withdrawn, in ISO 8601 format.
            submission:
              type: object
              nullable: true
              description: The accept/reject decision on a repository security advisory publish request
              properties:
                accepted:
                  type: boolean
                  description: Whether a private vulnerability report was accepted by the repository's administrators.
            vulnerabilities:
              type: array
              description: The products affected by the vulnerability detailed in the advisory.
              items:
                description: "One package version range affected by the advisory."
                type: object
                properties:
                  package:
                    description: "The package affected by the vulnerability."
                    type: object
                    properties:
                      ecosystem:
                        description: "The package ecosystem the affected package belongs to, e.g. npm."
                        type: string
                      name:
                        description: "The name of the affected package."
                        type: string
                  vulnerable_version_range:
                    description: "The range of versions affected by the vulnerability."
                    type: string
                    nullable: true
                  patched_versions:
                    description: "The versions that contain a patch for the vulnerability."
                    type: string
                    nullable: true
                  vulnerable_functions:
                    description: "The functions affected by the vulnerability."
                    type: array
                    items:
                      type: string
            cvss:
              description: "The CVSS score and vector for the advisory."
              type: object
              nullable: true
              properties:
                vector_string:
                  description: "The CVSS vector string describing the vulnerability's characteristics."
                  type: string
                  nullable: true
                score:
                  description: "The CVSS score of the vulnerability."
                  type: number
                  nullable: true
            cwes:
              description: "The CWE classifications for the advisory."
              type: array
              nullable: true
              items:
                description: "A CWE (Common Weakness Enumeration) classification for the advisory."
                type: object
                properties:
                  cwe_id:
                    description: "The CWE identifier, e.g. CWE-79."
                    type: string
                  name:
                    description: "The name of the CWE weakness."
                    type: string
            credits:
              description: "The users credited for reporting or fixing the advisory."
              type: array
              nullable: true
              items:
                description: "A user credited for reporting or fixing the advisory."
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  type:
                    description: "The type of credit given to the user, e.g. reporter."
                    type: string
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    SecurityAdvisoryPayload:
      type: object
      description: Payload for security_advisory events (GitHub-reviewed global advisories)
      required:
        - action
        - security_advisory
      properties:
        action:
          description: "The action that was performed. Can be one of: withdrawn, published, updated."
          type: string
          enum:
            - published
            - updated
            - withdrawn
        security_advisory:
          type: object
          description: |
            The details of the global security advisory, including summary,
            description, severity, and affected packages.
          required:
            - ghsa_id
            - summary
            - severity
          properties:
            schema_version:
              description: "The schema version of the security advisory payload, when present."
              type: string
            ghsa_id:
              type: string
              description: The GitHub Security Advisory ID.
            cve_id:
              type: string
              nullable: true
              description: The Common Vulnerabilities and Exposures (CVE) ID.
            url:
              type: string
              format: uri
              description: The API URL for the advisory.
            html_url:
              type: string
              format: uri
              description: The URL for the advisory.
            summary:
              type: string
              description: A short summary of the advisory.
            description:
              type: string
              description: A detailed description of what the advisory entails.
            severity:
              type: string
              enum:
                - critical
                - high
                - medium
                - low
                - unknown
              description: The severity of the advisory.
            identifiers:
              description: "The advisory's CVE and GHSA identifiers."
              type: array
              items:
                description: "An identifier (CVE or GHSA) for the security advisory."
                type: object
                properties:
                  value:
                    description: "The identifier value."
                    type: string
                  type:
                    description: "The type of identifier. Can be one of: CVE, GHSA."
                    type: string
                    enum: [CVE, GHSA]
            references:
              description: "URLs with more information about the security advisory."
              type: array
              items:
                description: "A URL providing more information about the security advisory."
                type: object
                properties:
                  url:
                    description: "A URL with more information about the security advisory."
                    type: string
                    format: uri
            published_at:
              type: string
              format: date-time
              description: The date and time of when the advisory was published, in ISO 8601 format.
            updated_at:
              type: string
              format: date-time
              description: The date and time of when the advisory was last updated, in ISO 8601 format.
            withdrawn_at:
              type: string
              format: date-time
              nullable: true
              description: The date and time of when the advisory was withdrawn, in ISO 8601 format.
            vulnerabilities:
              type: array
              items:
                description: "A package and version range affected by the advisory."
                type: object
                properties:
                  package:
                    description: "The vulnerable package affected by the advisory."
                    type: object
                    properties:
                      ecosystem:
                        description: "The package's language or package management ecosystem."
                        type: string
                      name:
                        description: "The unique package name within its ecosystem."
                        type: string
                  severity:
                    description: "The severity of the vulnerability, e.g. `low`, `moderate`, `high`, `critical`."
                    type: string
                    enum: [critical, high, medium, low, unknown]
                  vulnerable_version_range:
                    description: "The range of the package versions affected by the vulnerability."
                    type: string
                  first_patched_version:
                    description: "The first package version containing a fix for the vulnerability."
                    type: object
                    nullable: true
                    properties:
                      identifier:
                        description: "The package version that resolves the vulnerability."
                        type: string
              description: The products and respective version ranges affected by the advisory.
            cvss:
              description: "The CVSS score and vector string of the security advisory."
              type: object
              properties:
                vector_string:
                  description: "The CVSS vector string, or null if not scored."
                  type: string
                  nullable: true
                score:
                  description: "The CVSS score of the vulnerability."
                  type: number
            cwes:
              description: "The CWE weaknesses associated with the advisory."
              type: array
              items:
                description: "A CWE weakness classification associated with the advisory."
                type: object
                properties:
                  cwe_id:
                    description: "The Common Weakness Enumeration (CWE) identifier."
                    type: string
                  name:
                    description: "The name of the CWE weakness."
                    type: string
        installation:
          $ref: '#/components/schemas/Installation'


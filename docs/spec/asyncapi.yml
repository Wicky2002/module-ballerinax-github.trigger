                      type: array
                      items:
                        type: string
                    files:
                      description: "The file patterns to include when publishing, as declared in package.json."
                      type: array
                      items:
                        type: string
                    bin:
                      description: "The executable scripts declared in the package's package.json."
                      type: object
                      additionalProperties: true
                    man:
                      description: "The man page files declared in the package's package.json."
                      type: object
                      additionalProperties: true
                    directories:
                      description: "The directory layout hints declared in the package's package.json."
                      type: object
                      nullable: true
                      additionalProperties: true
                    os:
                      description: "The operating systems this package version supports, as declared in package.json."
                      type: array
                      items:
                        type: string
                    cpu:
                      description: "The CPU architectures this package version supports, as declared in package.json."
                      type: array
                      items:
                        type: string
                    readme:
                      description: "The contents of the package's README file."

                      format: date-time
                    published_at:
                      description: "The date and time the release was published, in ISO 8601 format."
                      type: string
                      format: date-time
                      nullable: true
                manifest:
                  description: "The raw package manifest file content for this version."
                  type: string
                  nullable: true
                html_url:
                  description: "The URL of the resource on GitHub.com."
                  type: string
                  format: uri
                tag_name:
                  description: "The name of the Git tag associated with this package version."
                  type: string
                  nullable: true

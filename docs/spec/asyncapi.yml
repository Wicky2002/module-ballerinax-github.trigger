              items:
                type: string

    RulePatternParameters:
      type: object
      description: |
        Shared by the 5 pattern-matching ruleset rules (commit_message_pattern,
        commit_author_email_pattern, committer_email_pattern, branch_name_pattern,
        tag_name_pattern) - identical parameters shape for all five per GitHub's own schema.
      required:
        - operator
        - pattern
      properties:
        name:
          type: string
          description: How this rule appears when configuring it.
        negate:
          type: boolean
          description: If true, the rule will fail if the pattern matches.
        operator:
          type: string
          enum:
            - starts_with
            - ends_with
            - contains
            - regex
          description: The operator to use for matching.
        pattern:
          type: string

          description: The pattern to match with.
    RuleActor:
      type: object
      description: An actor allowed to dismiss pull request reviews
      required:
        - id
        - type
      properties:
        id:
          type: integer
          description: The ID of the actor that can bypass the rule.
        type:
          type: string
          description: The type of actor that can bypass the rule.
          enum:
            - User
            - Team
            - IntegrationInstallation
            - RepositoryRole

    RuleReviewer:
      type: object
      description: A required reviewing team
      required:
        - id
        - type
      properties:
        id:
          type: integer
          description: The ID of the team required to review matching pull requests.
        type:
          type: string
          description: The type of actor required to review - always `Team`.
          enum:
            - Team

    RuleDismissalRestriction:
      type: object
      description: Specify people, teams, or apps allowed to dismiss pull request reviews.
      required:
        - enabled
      properties:
        allowed_actors:
          type: array
          items:
            $ref: '#/components/schemas/RuleActor'
          description: Specify people, teams, or apps allowed to dismiss pull request reviews.
        enabled:
          type: boolean

          description: Whether to restrict review dismissal to specific actors.
    RuleRequiredReviewerConfiguration:
      type: object
      description: A reviewing team, and file patterns describing which files they must approve changes to.
      required:
        - file_patterns
        - minimum_approvals
        - reviewer
      properties:
        file_patterns:
          type: array
          items:
            type: string
          description: The file patterns the required reviewer must approve changes to.
        minimum_approvals:
          type: integer
          description: The number of approvals required from the reviewing team.
        reviewer:
          $ref: '#/components/schemas/RuleReviewer'

    RuleStatusCheckConfiguration:
      type: object
      description: Required status check
      required:
        - context
      properties:
        context:
          type: string
          description: The status check context name that must pass for this rule to pass.
        integration_id:
          type: integer
          description: The ID of the GitHub App that must provide this status check.

    RuleWorkflowFileReference:
      type: object
      description: A workflow that must run for this rule to pass
      required:
        - path
        - repository_id
      properties:
        path:
          type: string
          description: The path to the workflow file.
        ref:
          type: string
          description: The ref (branch or tag) of the workflow file to use.
        repository_id:
          type: integer
          description: The ID of the repository where the workflow is defined.
        sha:
          type: string

          description: The commit SHA of the workflow file to use.
    RuleCodeScanningTool:
      type: object
      description: A tool that must provide code scanning results for this rule to pass.
      required:
        - alerts_threshold
        - security_alerts_threshold
        - tool
      properties:
        alerts_threshold:
          type: string
          enum:
            - none
            - errors
            - errors_and_warnings
            - all
          description: The severity level at which code scanning results that raise alerts block a reference update.
        security_alerts_threshold:
          type: string
          enum:
            - none
            - critical
            - high_or_higher
            - medium_or_higher
            - all
          description: The severity level at which code scanning results that raise security alerts block a reference update.
        tool:
          type: string

          description: The name of a code scanning tool.
    Category:
      type: object
      description: A discussion category
      required:
        - id
        - node_id
        - repository_id
        - name
        - slug
      properties:
        id:
          description: "The unique identifier of the resource."
          type: integer
        node_id:
          description: "The GraphQL node ID."
          type: string
        repository_id:
          description: "The ID of the repository this discussion category belongs to."
          type: integer
        emoji:
          description: "The emoji associated with the discussion category."
          type: string
        name:
          description: "The name of the discussion category."
          type: string
        description:
          description: "The description of the discussion category."
          type: string
        created_at:
          description: "The date and time the resource was created, in ISO 8601 format."
          type: string
          format: date-time
        updated_at:
          description: "The date and time the resource was last updated, in ISO 8601 format."
          type: string
          format: date-time
        slug:
          description: "The URL-friendly identifier of the resource."
          type: string
        is_answerable:
          description: "Whether discussions in this category can be marked as answered."
          type: boolean

    PullRequestMinimal:
      type: object
      description: |
        A minimal cross-reference to a pull request, as delivered in workflow_run/check_suite/
        check_run/deployment_review's pull_requests[] - NOT the full pull request resource (no
        title, state, user, etc.), so this must not $ref PullRequest or PullRequestRef.
      required:
        - id
        - number
        - url
        - head
        - base
      properties:
        id:
          description: "The pull request's unique identifier."
          type: integer
        number:
          description: "The pull request number."
          type: integer
        url:
          description: "The API URL of the resource."
          type: string
          format: uri
        head:
          description: "The head (source) branch, SHA, and repository of a minimal pull request reference."
          type: object
          properties:
            ref:
              description: "The name of the branch."
              type: string
            sha:
              description: "The SHA of the commit at the head of this branch."
              type: string
            repo:
              description: "A minimal repository reference (id, URL, name) used within a pull request's head ref."
              type: object
              properties:
                id:
                  description: "The unique identifier of the resource."
                  type: integer
                url:
                  description: "The API URL of the resource."
                  type: string
                  format: uri
                name:
                  description: "The name of the repository."
                  type: string
        base:
          description: "The base (target) branch, SHA, and repository of a minimal pull request reference."
          type: object
          properties:
            ref:
              description: "The name of the branch."
              type: string
            sha:
              description: "The SHA of the commit at the base of this branch."
              type: string
            repo:
              description: "A minimal repository reference (id, URL, name) used within a pull request's base ref."
              type: object
              properties:
                id:
                  description: "The unique identifier of the resource."
                  type: integer
                url:
                  description: "The API URL of the resource."
                  type: string
                  format: uri
                name:
                  description: "The name of the repository."
                  type: string

    App:
      type: object
      description: A GitHub App
      required:
        - id
        - node_id
        - name
      properties:
        id:
          type: integer
          description: Unique identifier of the GitHub app.
        node_id:
          description: "The GraphQL node ID."
          type: string
        owner:
          $ref: '#/components/schemas/User'
        name:
          type: string
          description: The name of the GitHub app.
        description:
          description: "The description of the GitHub App."
          type: string
          nullable: true
        external_url:
          description: "The URL of the GitHub App's external website."
          type: string
          format: uri
        html_url:
          description: "The URL of the resource on GitHub.com."
          type: string
          format: uri
        created_at:
          description: "The date and time the resource was created, in ISO 8601 format."
          type: string
          format: date-time
        updated_at:
          description: "The date and time the resource was last updated, in ISO 8601 format."
          type: string
          format: date-time
        permissions:
          type: object
          additionalProperties:
            type: string
          description: The set of permissions for the GitHub app.
        events:
          type: array
          items:
            type: string

          description: The list of events for the GitHub app. Note that the `installation_target`, `security_advisory`, and `meta` events are not included because they are global events and not specific to an installation.
    WorkflowJob:
      type: object
      description: A job in a GitHub Actions workflow run
      required:
        - id
        - name
        - status
      properties:
        id:
          type: integer
          description: The id of the job.
        run_id:
          type: integer
          description: The id of the associated workflow run.
        run_url:
          description: "The API URL of the associated workflow run."
          type: string
          format: uri
        run_attempt:
          type: integer
          description: Attempt number of the associated workflow run, 1 for first attempt and higher if the workflow was re-run.
        node_id:
          description: "The GraphQL node ID."
          type: string
        head_sha:
          type: string
          description: The SHA of the commit that is being run.
        url:
          description: "The API URL of the resource."
          type: string
          format: uri
        html_url:
          description: "The URL of the resource on GitHub.com."
          type: string
          format: uri
        status:
          type: string
          enum:
            - queued
            - in_progress
            - completed
            - waiting
          description: The phase of the lifecycle that the job is currently in.
        conclusion:
          type: string
          nullable: true
          enum:
            - action_required
            - cancelled
            - failure
            - neutral
            - skipped
            - success
            - timed_out
            - 
          description: The outcome of the job.
        created_at:
          type: string
          format: date-time
          description: The time that the job created, in ISO 8601 format.
        started_at:
          type: string
          format: date-time
          description: The time that the job started, in ISO 8601 format.
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: The time that the job finished, in ISO 8601 format.
        name:
          type: string
          description: The name of the job.
        steps:
          type: array
          items:
            description: "A single step within a GitHub Actions job."
            type: object
            properties:
              name:
                description: "The name of the step."
                type: string
              status:
                description: "The phase of the lifecycle that the step is currently in."
                type: string
              conclusion:
                description: "The result of the completed step, or null if not yet completed."
                type: string
                nullable: true
              number:
                description: "The step's position within the job."
                type: integer
              started_at:
                description: "The time the step began, or null if not yet started."
                type: string
                format: date-time
                nullable: true
              completed_at:
                description: "The time the step completed, or null if not yet completed."
                type: string
                format: date-time
                nullable: true
          description: Steps in this job.
        check_run_url:
          description: "The API URL of the associated check run."
          type: string
          format: uri
        labels:
          type: array
          items:
            type: string
          description: Labels for the workflow job. Specified by the "runs_on" attribute in the action's workflow file.
        runner_id:
          type: integer
          nullable: true
          description: The ID of the runner to which this job has been assigned. (If a runner hasn't yet been assigned, this will be null.)
        runner_name:
          type: string
          nullable: true
          description: The name of the runner to which this job has been assigned. (If a runner hasn't yet been assigned, this will be null.)
        runner_group_id:
          type: integer
          nullable: true
          description: The ID of the runner group to which this job has been assigned. (If a runner hasn't yet been assigned, this will be null.)
        runner_group_name:
          type: string
          nullable: true
          description: The name of the runner group to which this job has been assigned. (If a runner hasn't yet been assigned, this will be null.)
        workflow_name:
          type: string
          nullable: true
          description: The name of the workflow.
        head_branch:
          type: string
          nullable: true

          description: The name of the current branch.
    # -----------------------------------------------------------------------
    # Event payload schemas
    # -----------------------------------------------------------------------

    PingPayload:
      type: object
      description: Payload for the ping event
      properties:
        zen:
          type: string
          description: Random string of GitHub zen
        hook_id:
          type: integer
          description: The ID of the webhook that triggered the ping
        hook:
          type: object
          description: The webhook that is being pinged
          properties:
            type:
              description: "The kind of target the webhook is attached to. Can be one of: Repository, Organization, App."
              type: string
              enum:
                - Repository
                - Organization
                - App
                - Business
                - Marketplace
            id:
              type: integer
              description: Unique identifier of the webhook.
            name:
              type: string
              description: The name of a valid service, use 'web' for a webhook.
            active:
              type: boolean
              description: Determines whether the hook is actually triggered on pushes.
            events:
              type: array
              items:
                type: string
              description: "Determines what events the hook is triggered for. Default: ['push']."
            config:
              type: object
              description: Configuration object of the webhook.
              properties:
                content_type:
                  type: string
                  enum:
                    - json
                    - form
                  description: The media type used to serialize the payloads. The default is `form`.
                insecure_ssl:
                  type: string
                  description: Determines whether the SSL certificate of the host for `url` will be verified when delivering payloads. Supported values include `0` (verification is performed) and `1` (verification is not performed). The default is `0`.
                url:
                  type: string
                  format: uri
                  description: The URL to which the payloads will be delivered.
            updated_at:
              description: "The date and time the resource was last updated, in ISO 8601 format."
              type: string
              format: date-time
            created_at:
              description: "The date and time the resource was created, in ISO 8601 format."
              type: string
              format: date-time
            url:
              description: "The API URL of the resource."
              type: string
              format: uri
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'

    PushPayload:
      type: object
      description: Payload for the push event
      required:
        - ref
        - before
        - after
        - created
        - deleted
        - forced
        - commits
        - compare
        - pusher
        - sender
        - repository
      properties:
        ref:
          type: string
          description: The full git ref that was pushed (e.g. refs/heads/main or refs/tags/v3.14.1)
        before:
          type: string
          description: The SHA of the most recent commit on ref before the push
        after:
          type: string
          description: The SHA of the most recent commit on ref after the push
        base_ref:
          type: string
          nullable: true
          description: The base ref for the push (if applicable)
        created:
          type: boolean
          description: Whether this push created the ref
        deleted:
          type: boolean
          description: Whether this push deleted the ref
        forced:
          type: boolean
          description: Whether this push was a force push of the ref
        compare:
          type: string
          description: URL showing the changes in this ref update
        commits:
          type: array
          description: Array of commit objects (maximum 2048)
          items:
            $ref: '#/components/schemas/Commit'
        head_commit:
          $ref: '#/components/schemas/Commit'
          nullable: true
        pusher:
          $ref: '#/components/schemas/CommitAuthor'
          description: Metaproperties for the Git author/committer
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    PullRequestPayload:
      type: object
      description: Payload for pull_request events
      required:
        - action
        - number
        - pull_request
        - assignee
        - sender
        - repository
      properties:
        action:
          type: string
          description: The action that was performed
          enum:
            - assigned
            - auto_merge_disabled
            - auto_merge_enabled
            - closed
            - converted_to_draft
            - demilestoned
            - dequeued
            - edited
            - enqueued
            - labeled
            - locked
            - milestoned
            - opened
            - ready_for_review
            - reopened
            - review_request_removed
            - review_requested
            - synchronize
            - unassigned
            - unlabeled
            - unlocked
        number:
          type: integer
          description: The pull request number
        pull_request:
          $ref: '#/components/schemas/PullRequest'
        assignee:
          $ref: '#/components/schemas/User'
          nullable: true
        changes:
          type: object
          description: For edited events, the changes to the pull request
          properties:
            title:
              type: object
              description: The pull request's previous title, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
            body:
              type: object
              description: The pull request's previous body text, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
            base:
              type: object
              description: The pull request's previous base branch, before this edit.
              properties:
                ref:
                  description: "The pull request's previous base branch ref, before this edit."
                  type: object
                  properties:
                    from:
                      description: The previous value, before this change.
                      type: string
                sha:
                  description: "The pull request's previous base branch SHA, before this edit."
                  type: object
                  properties:
                    from:
                      description: The previous value, before this change.
                      type: string
        requested_reviewer:
          $ref: '#/components/schemas/User'
        label:
          $ref: '#/components/schemas/Label'
        milestone:
          $ref: '#/components/schemas/Milestone'
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    IssuesPayload:
      type: object
      description: Payload for issues events
      required:
        - action
        - issue
        - sender
        - repository
      properties:
        action:
          type: string
          description: The action that was performed
          enum:
            - assigned
            - closed
            - deleted
            - demilestoned
            - edited
            - labeled
            - locked
            - milestoned
            - opened
            - pinned
            - reopened
            - transferred
            - typed
            - unassigned
            - unlabeled
            - unlocked
            - unpinned
            - untyped
        issue:
          $ref: '#/components/schemas/Issue'
        assignee:
          $ref: '#/components/schemas/User'
          nullable: true
        label:
          $ref: '#/components/schemas/Label'
        changes:
          type: object
          description: For edited events, the changes to the issue
          properties:
            title:
              type: object
              description: The issue's previous title, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
            body:
              type: object
              description: The issue's previous body text, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
        milestone:
          $ref: '#/components/schemas/Milestone'
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    ReleasePayload:
      type: object
      description: Payload for release events
      required:
        - action
        - release
        - sender
        - repository
      properties:
        action:
          type: string
          description: The action that was performed
          enum:
            - created
            - deleted
            - edited
            - prereleased
            - published
            - released
            - unpublished
        release:
          $ref: '#/components/schemas/Release'
        changes:
          type: object
          description: For edited events, the changes to the release
          properties:
            body:
              type: object
              description: The release's previous body text, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
            name:
              type: object
              description: The release's previous name, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
            tag_name:
              type: object
              description: The release's previous tag name, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
            make_latest:
              type: object
              description: Whether this release was explicitly edited to be the latest
              properties:
                to:
                  description: "Whether the release became the latest release (best-effort; not documented by GitHub)."
                  type: boolean
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    IssueCommentPayload:
      type: object
      description: Payload for issue_comment events
      required:
        - action
        - issue
        - comment
        - sender
        - repository
      properties:
        action:
          description: "The action that was performed. Can be one of: created, edited, deleted, pinned, unpinned."
          type: string
          enum:
            - created
            - deleted
            - edited
            - pinned
            - unpinned
        issue:
          $ref: '#/components/schemas/Issue'
        comment:
          $ref: '#/components/schemas/IssueComment'
        changes:
          type: object
          description: For edited events, the changes to the comment
          required:
            - body
          properties:
            body:
              type: object
              description: The comment's previous body text, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    PullRequestReviewPayload:
      type: object
      description: Payload for pull_request_review events
      required:
        - action
        - review
        - pull_request
        - sender
        - repository
      properties:
        action:
          description: "The action that was performed. Can be one of: submitted, edited, dismissed."
          type: string
          enum:
            - dismissed
            - edited
            - submitted
        review:
          $ref: '#/components/schemas/PullRequestReview'
        pull_request:
          $ref: '#/components/schemas/PullRequest'
        changes:
          type: object
          description: For edited events, the changes to the review
          properties:
            body:
              type: object
              description: The review's previous body text, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    PullRequestReviewCommentPayload:
      type: object
      description: Payload for pull_request_review_comment events
      required:
        - action
        - comment
        - pull_request
        - sender
        - repository
      properties:
        action:
          description: "The action that was performed. Can be one of: created, deleted, edited."
          type: string
          enum:
            - created
            - deleted
            - edited
        comment:
          $ref: '#/components/schemas/PullRequestReviewComment'
        pull_request:
          $ref: '#/components/schemas/PullRequest'
        changes:
          type: object
          description: For edited events, the changes to the comment
          properties:
            body:
              type: object
              description: The comment's previous body text, before this edit.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    CreatePayload:
      type: object
      description: Payload for create events (branch or tag created)
      required:
        - ref
        - ref_type
        - master_branch
        - pusher_type
        - sender
        - repository
      properties:
        ref:
          type: string
          description: The git ref resource (branch or tag name)
        ref_type:
          type: string
          description: The type of Git ref object created
          enum:
            - branch
            - tag
        master_branch:
          type: string
          description: The name of the repository's default branch (usually main)
        description:
          type: string
          nullable: true
          description: The repository's current description
        pusher_type:
          type: string
          description: The pusher type; either user or a deploy key

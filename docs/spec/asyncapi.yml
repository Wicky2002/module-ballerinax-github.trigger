        $ref: '#/components/schemas/WebhookHeaders'
      payload:
        $ref: '#/components/schemas/SecretScanningAlertPayload'
  schemas:

    # -----------------------------------------------------------------------
    # Delivery headers present on every GitHub webhook POST request
    # -----------------------------------------------------------------------
    WebhookHeaders:
      description: "HTTP headers sent with every GitHub webhook delivery."
      type: object
      required:
        - X-GitHub-Event
        - X-GitHub-Delivery
        - X-GitHub-Hook-ID
      properties:
        X-GitHub-Event:
          type: string
          description: The name of the event that triggered the delivery
          examples:
            - push
            - pull_request
            - issues
        X-GitHub-Delivery:
          type: string
          format: uuid
          description: A globally unique identifier (GUID) for this delivery
        X-GitHub-Hook-ID:
          type: integer
          description: The unique identifier of the webhook
        X-GitHub-Hook-Installation-Target-ID:
          type: integer
          description: The unique identifier of the resource where the webhook was created
        X-GitHub-Hook-Installation-Target-Type:
          type: string
          description: The type of resource where the webhook was created
          enum:
            - repository
            - organization
            - app
            - business
            - marketplace
        X-Hub-Signature:
          type: string
          description: |
            HMAC hex digest of the request body using SHA-1. Sent only when a
            webhook secret is configured. Use X-Hub-Signature-256 instead.
        X-Hub-Signature-256:
          type: string
          description: |
            HMAC hex digest of the request body using SHA-256. Sent only when
            a webhook secret is configured. Preferred over X-Hub-Signature.
        User-Agent:
          type: string
          description: Always has the prefix GitHub-Hookshot/
          examples:
            - GitHub-Hookshot/044aadd

    # -----------------------------------------------------------------------
    # Common reusable object schemas
    # -----------------------------------------------------------------------

    User:
      type: object
      description: A GitHub user
      required:
        - login
        - id
      properties:
        login:
          type: string
          description: The user's GitHub username
        id:
          type: integer
          description: The user's unique numeric identifier
        node_id:
          description: "The GraphQL node ID."
          type: string
        avatar_url:
          description: "The URL of the user's or organization's avatar image."
          type: string
          format: uri
        gravatar_id:
          description: "The user's Gravatar ID (legacy field, typically empty)."
          type: string
          nullable: true
        url:
          description: "The API URL of the resource."
          type: string
          format: uri
        html_url:
          description: "The URL of the resource on GitHub.com."
          type: string
          format: uri
        type:
          description: "The account type: User, Organization, or Bot."
          type: string
          enum:
            - User
            - Bot
            - Organization
        site_admin:
          description: "Whether the user is a GitHub site administrator."
          type: boolean

    Repository:
      type: object
      description: A repository on GitHub
      required:
        - id
        - name
        - full_name
        - owner
        - private
      properties:
        id:
          type: integer
          description: Unique identifier of the repository.
        node_id:
          type: string
          description: The GraphQL identifier of the repository.
        name:
          type: string
          description: The repository name
        full_name:
          type: string
          description: The full repository name including owner (e.g. octocat/Hello-World)
        owner:
          $ref: '#/components/schemas/User'
        private:
          type: boolean
          description: Whether the repository is private
        html_url:
          type: string
          format: uri
          description: The URL to view the repository on GitHub.com.
        description:
          type: string
          nullable: true
          description: The repository description.
        fork:
          type: boolean
          description: Whether the repository is a fork.
        url:
          type: string
          format: uri
          description: The URL to get more information about the repository from the GitHub API.
        homepage:
          description: "The repository's homepage URL, if set."
          type: string
          nullable: true
        language:
          description: "The repository's primary programming language."
          type: string
          nullable: true
        forks_count:
          description: "The number of forks of the repository."
          type: integer
        stargazers_count:
          description: "The number of users who have starred the repository."
          type: integer
        watchers_count:
          description: "The number of users watching the repository."
          type: integer
        size:
          type: integer
          description: The size of the repository, in kilobytes. Size is calculated hourly. When a repository is initially created, the size is 0.
        default_branch:
          type: string
          description: The default branch of the repository.
        open_issues_count:
          description: "The number of open issues and pull requests in the repository."
          type: integer
        topics:
          description: "The list of topics associated with the repository."
          type: array
          items:
            type: string
        has_issues:
          type: boolean
          description: Whether issues are enabled.
        has_projects:
          type: boolean
          description: Whether projects are enabled.
        has_wiki:
          type: boolean
          description: Whether the wiki is enabled.
        has_pages:
          description: "Whether GitHub Pages is enabled for the repository."
          type: boolean
        has_downloads:
          type: boolean
          description: Whether downloads are enabled.
        archived:
          type: boolean
          description: Whether the repository is archived.
        disabled:
          type: boolean
          description: Returns whether or not this repository is disabled.
        visibility:
          type: string
          enum:
            - public
            - private
            - internal
          description: "The repository visibility: public, private, or internal."
        pushed_at:
          description: "The date and time the repository was last pushed to."
          type: string
          format: date-time
          nullable: true
        created_at:
          description: "The date and time the resource was created, in ISO 8601 format."
          type: string
          format: date-time
        updated_at:
          description: "The date and time the resource was last updated, in ISO 8601 format."
          type: string
          format: date-time
        license:
          description: "A repository's software license."
          type: object
          nullable: true
          properties:
            key:
              description: "The SPDX license key identifier, e.g. mit."
              type: string
            name:
              description: "The full name of the license."
              type: string
            spdx_id:
              description: "The SPDX identifier of the license."
              type: string
            url:
              description: "The API URL of the resource."
              type: string
              nullable: true

    Organization:
      type: object
      description: A GitHub organization
      properties:
        login:
          description: "The organization's login name."
          type: string
        id:
          description: "The unique identifier of the resource."
          type: integer
        node_id:
          description: "The GraphQL node ID."
          type: string
        url:
          description: "The API URL of the resource."
          type: string
          format: uri
        html_url:
          description: "The URL of the resource on GitHub.com."
          type: string
          format: uri
        repos_url:
          description: "The API URL listing the organization's repositories."
          type: string
          format: uri
        avatar_url:
          description: "The URL of the user's or organization's avatar image."
          type: string
          format: uri
        description:
          description: "A short description of the organization."
          type: string
          nullable: true

    Installation:
      type: object
      description: A GitHub App installation
      properties:
        id:
          type: integer
          description: The ID of the installation.
        node_id:
          description: "The GraphQL node ID."
          type: string

    Enterprise:
      type: object
      description: A GitHub Enterprise account
      properties:
        id:
          type: integer
          description: Unique identifier of the enterprise.
        slug:
          type: string
          description: The slug url identifier for the enterprise.
        name:
          type: string
          description: The name of the enterprise.
        node_id:
          description: "The GraphQL node ID."
          type: string
        avatar_url:
          description: "The URL of the user's or organization's avatar image."
          type: string
          format: uri
        description:
          type: string
          nullable: true
          description: A short description of the enterprise.
        website_url:
          type: string
          nullable: true
          description: The enterprise's website URL.
        html_url:
          description: "The URL of the resource on GitHub.com."
          type: string
          format: uri
        created_at:
          description: "The date and time the resource was created, in ISO 8601 format."
          type: string
          format: date-time
        updated_at:
          description: "The date and time the resource was last updated, in ISO 8601 format."
          type: string
          format: date-time

    # Common payload fields present on most webhook events
    CommonPayload:
      description: "Shared sender/repository/organization/installation/enterprise fields; not referenced elsewhere in this module."
      type: object
      properties:
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    Label:
      type: object
      description: A label on an issue or pull request
      required:
        - id
        - name
        - color
      properties:
        id:
          type: integer
          description: Unique identifier for the label.
        node_id:
          description: "The GraphQL node ID."
          type: string
        url:
          type: string
          format: uri
          description: URL for the label.
        name:
          type: string
          description: The name of the label.
        color:
          type: string
          description: 6-character hex color code
        default:
          type: boolean
          description: Whether this label comes by default in a new repository.
        description:
          type: string
          nullable: true

          description: Optional description of the label, such as its purpose.
    Milestone:
      type: object
      nullable: true
      description: A milestone on an issue or pull request
      properties:
        id:
          description: "The unique identifier of the resource."
          type: integer
        node_id:
          description: "The GraphQL node ID."
          type: string
        number:
          type: integer
          description: The number of the milestone.
        title:
          type: string
          description: The title of the milestone.
        description:
          description: "A description of the milestone."
          type: string
          nullable: true
        state:
          type: string
          enum:
            - open
            - closed
          description: The state of the milestone.
        open_issues:
          description: "The number of open issues associated with the milestone."
          type: integer
        closed_issues:
          description: "The number of closed issues associated with the milestone."
          type: integer
        created_at:
          description: "The date and time the resource was created, in ISO 8601 format."
          type: string
          format: date-time
        updated_at:
          description: "The date and time the resource was last updated, in ISO 8601 format."
          type: string
          format: date-time
        due_on:
          description: "The date the milestone is due, in ISO 8601 format."
          type: string
          format: date-time
          nullable: true
        closed_at:
          description: "The date and time the milestone was closed, in ISO 8601 format."
          type: string
          format: date-time
          nullable: true
        creator:
          $ref: '#/components/schemas/User'

    Issue:
      type: object
      description: An issue on GitHub
      required:
        - id
        - number
        - title
        - state
      properties:
        id:
          description: "The unique identifier of the resource."
          type: integer
        node_id:
          description: "The GraphQL node ID."
          type: string
        url:
          type: string
          format: uri
          description: URL for the issue.
        html_url:
          description: "The URL of the resource on GitHub.com."
          type: string
          format: uri
        number:
          type: integer
          description: Number uniquely identifying the issue within its repository.
        title:
          type: string
          description: Title of the issue.
        body:
          type: string
          nullable: true
          description: Contents of the issue.
        state:
          type: string
          enum:
            - open
            - closed
          description: State of the issue; either `open` or `closed`.
        locked:
          description: "Whether the issue's conversation has been locked."
          type: boolean
        user:
          $ref: '#/components/schemas/User'
        labels:
          description: "Labels attached to the issue."
          type: array
          items:
            $ref: '#/components/schemas/Label'
        assignee:
          $ref: '#/components/schemas/User'
          nullable: true
        assignees:
          description: "The users assigned to the issue."
          type: array
          items:
            $ref: '#/components/schemas/User'
        milestone:
          $ref: '#/components/schemas/Milestone'
        comments:
          description: "The number of comments on the issue."
          type: integer
        created_at:
          description: "The date and time the resource was created, in ISO 8601 format."
          type: string
          format: date-time
        updated_at:
          description: "The date and time the resource was last updated, in ISO 8601 format."
          type: string
          format: date-time
        closed_at:
          description: "The date and time the issue was closed, if closed."
          type: string
          format: date-time
          nullable: true
        author_association:
          type: string
          enum:
            - COLLABORATOR
            - CONTRIBUTOR
            - FIRST_TIMER
            - FIRST_TIME_CONTRIBUTOR
            - MANNEQUIN
            - MEMBER
            - NONE
            - OWNER
          description: How the author is associated with the repository.
        active_lock_reason:
          description: "The reason the issue's conversation was locked, if locked."
          type: string
          nullable: true

    PullRequestRef:
      type: object
      description: A pull request head or base ref
      properties:
        label:
          description: "The ref's label in owner:branch form, e.g. octocat:main."
          type: string
        ref:
          description: "The name of the branch or tag."
          type: string
        sha:
          description: "The SHA of the commit at the tip of the ref."
          type: string
        user:
          $ref: '#/components/schemas/User'
        repo:
          $ref: '#/components/schemas/Repository'

    PullRequest:
      type: object
      description: A pull request
      required:
        - id
        - number
        - state
        - title
      properties:
        id:
          description: "The unique identifier of the resource."
          type: integer
        node_id:
          description: "The GraphQL node ID."
          type: string
        url:
          description: "The API URL of the resource."
          type: string
          format: uri
        html_url:
          description: "The URL of the resource on GitHub.com."
          type: string
          format: uri
        diff_url:
          description: "The URL to the pull request's diff in unified diff format."
          type: string
          format: uri
        patch_url:
          description: "The URL to the pull request's patch file."
          type: string
          format: uri
        number:
          type: integer
          description: Number uniquely identifying the pull request within its repository.
        state:
          type: string
          enum:
            - open
            - closed
          description: State of this Pull Request. Either `open` or `closed`.
        locked:
          description: "Whether the pull request's conversation is locked."
          type: boolean
        title:
          type: string
          description: The title of the pull request.
        body:
          description: "The pull request's description text."
          type: string
          nullable: true
        user:
          $ref: '#/components/schemas/User'
        labels:
          description: "The labels attached to the pull request."
          type: array
          items:
            $ref: '#/components/schemas/Label'
        assignee:
          $ref: '#/components/schemas/User'
          nullable: true
        assignees:
          description: "The users assigned to the pull request."
          type: array
          items:
            $ref: '#/components/schemas/User'
        milestone:
          $ref: '#/components/schemas/Milestone'
        head:
          $ref: '#/components/schemas/PullRequestRef'
        base:
          $ref: '#/components/schemas/PullRequestRef'
        draft:
          type: boolean
          description: Indicates whether or not the pull request is a draft.
        merged:
          description: "Whether the pull request has been merged."
          type: boolean
          nullable: true
        mergeable:
          description: "Whether the pull request can be merged into its base branch."
          type: boolean
          nullable: true
        rebaseable:
          description: "Whether the pull request can be rebased against its base branch."
          type: boolean
          nullable: true
        mergeable_state:
          description: "The mergeability state of the pull request, e.g. clean or dirty."
          type: string
        merge_commit_sha:
          description: "The SHA of the merge commit, or the last commit if not yet merged."
          type: string
          nullable: true
        comments:
          description: "The number of issue comments on the pull request."
          type: integer
        review_comments:
          description: "The number of review comments on the pull request."
          type: integer
        commits:
          description: "The number of commits in the pull request."
          type: integer
        additions:
          description: "The number of lines added across the pull request's commits."
          type: integer
        deletions:
          description: "The number of lines deleted across the pull request's commits."
          type: integer
        changed_files:
          description: "The number of files changed in the pull request."
          type: integer
        created_at:
          description: "The date and time the resource was created, in ISO 8601 format."
          type: string
          format: date-time
        updated_at:
          description: "The date and time the resource was last updated, in ISO 8601 format."
          type: string
          format: date-time
        closed_at:
          description: "The date and time the pull request was closed, in ISO 8601 format."
          type: string
          format: date-time
          nullable: true
        merged_at:
          description: "The date and time the pull request was merged, in ISO 8601 format."
          type: string
          format: date-time
          nullable: true
        merged_by:
          $ref: '#/components/schemas/User'
          nullable: true
        author_association:
          type: string
          description: How the author is associated with the repository.
          enum:
            - COLLABORATOR
            - CONTRIBUTOR
            - FIRST_TIMER
            - FIRST_TIME_CONTRIBUTOR
            - MANNEQUIN
            - MEMBER
            - NONE
            - OWNER
        auto_merge:
          type: object
          nullable: true
          description: Details of an auto-merge request, if one is enabled on this pull request
          properties:
            enabled_by:
              $ref: '#/components/schemas/User'
            merge_method:
              type: string
              enum:
                - merge
                - squash
                - rebase
              description: The merge method to use.
            commit_title:
              type: string
              description: Title for the merge commit message.
            commit_message:
              type: string

              description: Commit message for the merge commit.
    Release:
      type: object
      description: A GitHub release
      required:
        - id
        - tag_name
        - name
      properties:
        id:
          description: "The unique identifier of the resource."
          type: integer
        node_id:
          description: "The GraphQL node ID."
          type: string
        url:
          description: "The API URL of the resource."
          type: string
          format: uri
        html_url:
          description: "The URL of the resource on GitHub.com."
          type: string
          format: uri
        assets_url:
          description: "The API URL listing the release's assets."
          type: string
          format: uri
        upload_url:
          description: "The URI template for uploading assets to this release."
          type: string
        tag_name:
          type: string
          description: The name of the tag.
        name:
          description: "The name of the release."
          type: string
          nullable: true
        body:
          description: "Text describing the contents of the tag."
          type: string
          nullable: true
        draft:
          type: boolean
          description: Whether the release is a draft or published.
        prerelease:
          type: boolean
          description: Whether the release is identified as a prerelease or a full release.
        target_commitish:
          type: string
          description: Specifies the commitish value that determines where the Git tag is created from.
        author:
          $ref: '#/components/schemas/User'
        assets:
          description: "The release's downloadable file attachments."

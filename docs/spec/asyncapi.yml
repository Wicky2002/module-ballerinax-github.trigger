    RepositoryVulnerabilityAlertPayload:
      type: object
      description: Payload for repository_vulnerability_alert events (closing down — use dependabot_alert)
      required:
        - action
        - alert
      properties:
        action:
          description: "The action that was performed. Can be one of: create, dismiss, reopen, resolve."
          type: string
          enum:
            - create
            - dismiss
            - reopen
            - resolve
        alert:
          type: object
          description: The security alert of the vulnerable dependency
          required:
            - id
            - affected_package_name
            - affected_range
            - severity
          properties:
            id:
              description: "The unique identifier of the resource."
              type: integer
            affected_package_name:
              description: "The name of the package affected by the vulnerability."
              type: string
            affected_range:
              description: "The range of package versions affected by the vulnerability."
              type: string
            fixed_in:
              description: "The package version that resolves the vulnerability."
              type: string
              nullable: true
            severity:
              description: "The severity of the vulnerability."
              type: string
              enum:
                - low
                - moderate
                - high
                - critical
            ghsa_id:
              description: "The GitHub Security Advisory identifier for the vulnerability."
              type: string
            external_identifier:
              description: "The vulnerability's identifier in an external database, e.g. a CVE ID."
              type: string
            external_reference:
              description: "A URL to the vulnerability's external reference source."
              type: string
              format: uri
              nullable: true
            created_at:
              description: "The date and time the resource was created, in ISO 8601 format."
              type: string
              format: date-time
            auto_dismissed_at:
              description: "The date and time the alert was automatically dismissed, in ISO 8601 format."
              type: string
              format: date-time
              nullable: true
            dismiss_reason:
              description: "The reason the alert was dismissed."
              type: string
              nullable: true
            dismissed_at:
              description: "The date and time the alert was dismissed, in ISO 8601 format."
              type: string
              format: date-time
              nullable: true
            dismissed_by:
              $ref: '#/components/schemas/User'
              nullable: true
            number:
              description: "The alert number, unique within the repository."
              type: integer
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'

    SecretScanningAlertLocationPayload:
      type: object
      description: Payload for secret_scanning_alert_location events
      required:
        - alert
        - location
      properties:
        alert:
          type: object
          description: The existing secret scanning alert the location was added to
          required:
            - number
            - secret_type
          properties:
            number:
              type: integer
              description: The security alert number.
            secret_type:
              type: string
              description: The type of secret that secret scanning detected.
        location:
          type: object
          description: The location where the secret was found
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - commit
                - wiki_commit
                - issue_title
                - issue_body
                - issue_comment
                - discussion_title
                - discussion_body
                - discussion_comment
                - pull_request_title
                - pull_request_body
                - pull_request_comment
                - pull_request_review
                - pull_request_review_comment
              description: The location type. Because secrets may be found in different types of resources (ie. code, comments, issues, pull requests, discussions), this field identifies the type of resource where the secret was found.
            details:
              type: object
              description: Location details; shape varies by type
              properties:
                path:
                  type: string
                  description: The file path in the repository.
                start_line:
                  type: integer
                  description: Line number at which the secret starts in the file.
                end_line:
                  type: integer
                  description: Line number at which the secret ends in the file.
                start_column:
                  type: integer
                  description: The column at which the secret starts within the start line when the file is interpreted as 8BIT ASCII.
                end_column:
                  type: integer
                  description: The column at which the secret ends within the end line when the file is interpreted as 8BIT ASCII.
                blob_sha:
                  type: string
                  description: SHA-1 hash ID of the associated blob.
                blob_url:
                  type: string
                  format: uri
                  description: The API URL to get the associated blob resource.
                commit_sha:
                  type: string
                  description: SHA-1 hash ID of the associated commit.
                commit_url:
                  type: string
                  format: uri
                  description: The API URL to get the associated commit resource.
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    SecretScanningScanPayload:
      type: object
      description: Payload for secret_scanning_scan events. No action field.
      required:
        - type
        - source
        - started_at
        - completed_at
      properties:
        type:
          type: string
          description: What type of scan was completed
          enum:
            - backfill
            - custom-pattern
            - pattern-update
        source:
          type: string
          description: What type of content was scanned
          enum:
            - git
            - issues
            - pull_requests
            - wiki
        started_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the scan started
        completed_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the scan completed
        secret_types:
          type: array
          nullable: true
          description: Patterns updated. Empty for normal backfill or custom pattern scans.
          items:
            type: string
        custom_pattern_name:
          type: string
          nullable: true
          description: If triggered by a custom pattern update, the name of that pattern
        custom_pattern_scope:
          type: string
          nullable: true
          description: If triggered by a custom pattern update, the scope of that pattern
          enum:
            - global
            - organization
            - repository
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    # -----------------------------------------------------------------------
    # Batch 6 — Final 4 event payload schemas
    # -----------------------------------------------------------------------

    PageBuildPayload:
      type: object
      description: Payload for page_build events. No action field.
      required:
        - id
        - build
      properties:
        id:
          type: integer
          description: The unique identifier of the page build
        build:
          type: object
          description: The GitHub Pages build object
          required:
            - url
            - status
            - error
            - pusher
            - commit
            - duration
            - created_at
            - updated_at
          properties:
            url:
              description: "The API URL of the resource."
              type: string
              format: uri
            status:
              type: string
              description: Current build status
              enum:
                - queued
                - building
                - built
                - errored
            error:
              type: object
              description: Error information if the build failed
              required:
                - message
              properties:
                message:
                  description: "The error message describing why the Pages build failed."
                  type: string
                  nullable: true
            pusher:
              $ref: '#/components/schemas/User'
            commit:
              type: string
              description: The SHA of the commit that triggered the build
            duration:
              type: integer
              description: Duration of the build in milliseconds
            created_at:
              description: "The date and time the resource was created, in ISO 8601 format."
              type: string
              format: date-time
            updated_at:
              description: "The date and time the resource was last updated, in ISO 8601 format."
              type: string
              format: date-time
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    TeamAddPayload:
      type: object
      description: |
        Payload for team_add events. Fired when a repository is added to a team.
        No action field.
      required:
        - team
      properties:
        team:
          type: object
          description: The team that was granted access to the repository
          required:
            - id
            - node_id
            - name
            - slug
          properties:
            id:
              type: integer
              description: Unique identifier of the team.
            node_id:
              description: "The GraphQL node ID."
              type: string
            url:
              type: string
              format: uri
              description: URL for the team.
            html_url:
              description: "The URL of the resource on GitHub.com."
              type: string
              format: uri
            name:
              type: string
              description: Name of the team.
            slug:
              description: "The URL-friendly identifier of the resource."
              type: string
            description:
              type: string
              nullable: true
              description: Description of the team.
            privacy:
              type: string
              enum:
                - closed
                - secret
              description: The level of privacy this team should have.
            notification_setting:
              type: string
              enum:
                - notifications_enabled
                - notifications_disabled
              description: The notification setting the team has set.
            permission:
              type: string
              enum:
                - pull
                - push
                - admin
                - maintain
                - triage
              description: Permission that the team will have for its repositories.
            members_url:
              description: "The API URL listing the members of this team."
              type: string
            repositories_url:
              description: "The API URL listing the repositories associated with this resource."
              type: string
              format: uri
            parent:
              type: object
              nullable: true
              description: The parent team, if this is a child team
              properties:
                id:
                  type: integer
                  description: Unique identifier of the team.
                node_id:
                  description: "The GraphQL node ID."
                  type: string
                name:
                  type: string
                  description: Name of the team.
                slug:
                  description: "The URL-friendly identifier of the resource."
                  type: string
                description:
                  type: string
                  nullable: true
                  description: Description of the team.
                privacy:
                  type: string
                  description: The level of privacy this team should have.
                permission:
                  type: string
                  description: Permission that the team will have for its repositories.
                members_url:
                  description: "The API URL listing the members of this team."
                  type: string
                repositories_url:
                  description: "The API URL listing the repositories associated with this resource."
                  type: string
                  format: uri
                html_url:
                  description: "The URL of the resource on GitHub.com."
                  type: string
                  format: uri
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    SponsorshipPayload:
      type: object
      description: Payload for sponsorship events
      required:
        - action
        - sponsorship
      properties:
        action:
          description: "The action that was performed. Can be one of: created, cancelled, edited, tier_changed, pending_cancellation, pending_tier_change."
          type: string
          enum:
            - cancelled
            - created
            - edited
            - pending_cancellation
            - pending_tier_change
            - tier_changed
        sponsorship:
          type: object
          description: The sponsorship object
          required:
            - node_id
            - created_at
            - privacy_level
            - tier
            - sponsor
            - sponsorable
          properties:
            node_id:
              description: "The GraphQL node ID."
              type: string
            created_at:
              description: "The date and time the resource was created, in ISO 8601 format."
              type: string
              format: date-time
            privacy_level:
              description: "Whether the sponsorship is publicly visible (public or private)."
              type: string
              enum:
                - public
                - private
            tier:
              $ref: '#/components/schemas/Tier'
            sponsor:
              $ref: '#/components/schemas/User'
            sponsorable:
              $ref: '#/components/schemas/User'
        changes:
          type: object
          nullable: true
          description: For edited, tier_changed, and pending_tier_change events
          properties:
            tier:
              type: object
              description: The sponsorship's previous tier, before this change.
              properties:
                from:
                  $ref: '#/components/schemas/Tier'
            privacy_level:
              type: object
              description: The sponsorship's previous privacy level, before this change.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
        effective_date:
          type: string
          format: date
          nullable: true
          description: |
            For pending_cancellation and pending_tier_change, the date the
            change takes effect (ISO 8601 date).
        sender:
          $ref: '#/components/schemas/User'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'

    SecurityAndAnalysisPayload:
      type: object
      description: |
        Payload for security_and_analysis events. Fired when code security and
        analysis features are enabled or disabled for a repository. No action field.
      required:
        - changes
      properties:
        changes:
          type: object
          description: The security and analysis settings that changed
          properties:
            advanced_security:
              type: object
              description: Change to GitHub Advanced Security enablement
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
                  enum:
                    - enabled
                    - disabled
                to:
                  description: "The new value, after this change."
                  type: string
                  enum:
                    - enabled
                    - disabled
            dependabot_alerts:
              type: object
              description: Change to Dependabot alerts enablement
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
                  enum:
                    - enabled
                    - disabled
                to:
                  description: "The new value, after this change."
                  type: string
                  enum:
                    - enabled
                    - disabled
            dependabot_security_updates:
              type: object
              description: Change to Dependabot security updates enablement
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
                  enum:
                    - enabled
                    - disabled
                to:
                  description: "The new value, after this change."
                  type: string
                  enum:
                    - enabled
                    - disabled
            secret_scanning:
              type: object
              description: Change to secret scanning enablement
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
                  enum:
                    - enabled
                    - disabled
                to:
                  description: "The new value, after this change."
                  type: string
                  enum:
                    - enabled
                    - disabled
            secret_scanning_push_protection:
              type: object
              description: Change to secret scanning push protection enablement
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
                  enum:
                    - enabled
                    - disabled
                to:
                  description: "The new value, after this change."
                  type: string
                  enum:
                    - enabled
                    - disabled
            secret_scanning_non_provider_patterns:
              type: object
              description: Change to non-provider pattern scanning enablement
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
                  enum:
                    - enabled
                    - disabled
                to:
                  description: "The new value, after this change."
                  type: string
                  enum:
                    - enabled
                    - disabled
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    # -----------------------------------------------------------------------
    # Batch 7 — Final 10 event payload schemas
    # -----------------------------------------------------------------------

    DeploymentReviewPayload:
      type: object
      description: Payload for deployment_review events
      required:
        - action
        - environment
        - workflow_run
        - since
      properties:
        action:
          description: "The action that was performed. Can be one of: requested, approved, rejected."
          type: string
          enum:
            - approved
            - rejected
            - requested
        environment:
          type: string
          description: The name of the environment that was approved or rejected
        comment:
          type: string
          nullable: true
          description: The reviewer's comment (for approved/rejected)
        since:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 date of when the review was requested
        reviewers:
          type: array
          description: The reviewers who were requested or who reviewed
          items:
            description: "A user or team requested as, or acting as, a deployment reviewer."
            type: object
            properties:
              type:
                description: "The type of the reviewer, either User or Team."
                type: string
                enum:
                  - Team
                  - User
              reviewer:
                description: A User or Team object depending on type
                oneOf:
                  - $ref: '#/components/schemas/User'
                  - type: object
                    description: Team reviewer
                    properties:
                      id:
                        type: integer
                        description: Unique identifier of the team.
                      node_id:
                        type: string
                        description: The node ID of the team.
                      name:
                        type: string
                        description: Name of the team.
                      slug:
                        type: string
                        description: The URL-friendly slug of the team's name.
                      description:
                        type: string
                        nullable: true
                        description: Description of the team.
                      privacy:
                        type: string
                        description: The level of privacy this team should have.
                      permission:
                        type: string
                        description: Permission that the team will have for its repositories.
                      html_url:
                        type: string
                        format: uri
                        description: URL for the team.
        workflow_run:
          type: object
          description: The workflow run associated with the deployment
          required:
            - id
            - name
          properties:
            id:
              type: integer
              description: The ID of the workflow run.
            name:
              type: string
              nullable: true
              description: The name of the workflow run.
            head_sha:
              type: string
              description: The SHA of the head commit that points to the version of the workflow being run.
            head_branch:
              type: string
              nullable: true
              description: The branch that triggered the workflow run.
            run_number:
              type: integer
              description: The auto incrementing run number for the workflow run.
            status:
              type: string
              description: The status of the workflow run.
            conclusion:
              type: string
              nullable: true
              description: The result of the completed workflow run.
            html_url:
              type: string
              format: uri
              description: The URL to view the workflow run on GitHub.
            pull_requests:
              type: array
              items:
                $ref: '#/components/schemas/PullRequestMinimal'
              description: Pull requests that are open with a `head_sha` or `head_branch` that matches the workflow run. The returned pull requests do not necessarily indicate pull requests that triggered the run.
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    InstallationTargetPayload:
      type: object
      description: Payload for installation_target events (GitHub App installation account renamed)
      required:
        - action
        - account
        - target_type
        - changes
      properties:
        action:
          description: "The action that was performed. Always: renamed."
          type: string
          enum:
            - renamed
        account:
          type: object
          description: The account (user or organization) where the app is installed
          required:
            - id
            - login
            - type
          properties:
            id:
              description: "The unique identifier of the resource."
              type: integer
            node_id:
              description: "The GraphQL node ID."
              type: string
            login:
              description: "The username or organization login of the account."
              type: string
            type:
              description: "The account type. Can be one of: Bot, User, Organization."
              type: string
              enum:
                - User
                - Organization
            avatar_url:
              description: "The URL of the user's or organization's avatar image."
              type: string
              format: uri
            html_url:
              description: "The URL of the resource on GitHub.com."
              type: string
              format: uri
            site_admin:
              description: "Whether the user is a GitHub site administrator."
              type: boolean
        target_type:
          description: "The type of account the app is installed on: user or organization."
          type: string
          enum:
            - User
            - Organization
        changes:
          type: object
          description: The changes made to the account
          properties:
            login:
              type: object
              description: The account's previous login, before this rename.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
            slug:
              type: object
              description: The account's previous slug, before this rename.
              properties:
                from:
                  description: The previous value, before this change.
                  type: string
        installation:
          $ref: '#/components/schemas/Installation'

    IssueDependenciesPayload:
      type: object
      description: Payload for issue_dependencies events
      required:
        - action
      properties:
        action:
          description: "The action that was performed. Can be one of: blocking_removed, blocked_by_removed, blocking_added, blocked_by_added."
          type: string
          enum:
            - blocked_by_added
            - blocked_by_removed
            - blocking_added
            - blocking_removed
        blocked_issue_id:
          type: integer
          description: The ID of the blocked issue.
        blocked_issue:
          $ref: '#/components/schemas/Issue'
        blocking_issue_id:
          type: integer
          description: The ID of the blocking issue.
        blocking_issue:
          $ref: '#/components/schemas/Issue'
        blocking_issue_repo:
          $ref: '#/components/schemas/Repository'
        sender:
          $ref: '#/components/schemas/User'
        repository:
          $ref: '#/components/schemas/Repository'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    MarketplacePurchasePayload:
      type: object
      description: Payload for marketplace_purchase events
      required:
        - action
        - marketplace_purchase
        - sender
        - effective_date
      properties:
        action:
          description: "The action that was performed. Can be one of: purchased, cancelled, pending_change, pending_change_cancelled, changed."
          type: string
          enum:
            - cancelled
            - changed
            - pending_change
            - pending_change_cancelled
            - purchased
        marketplace_purchase:
          $ref: '#/components/schemas/MarketplacePurchase'
        previous_marketplace_purchase:
          $ref: '#/components/schemas/MarketplacePurchase'
          nullable: true
          description: The previous purchase state (for changed/pending_change events)
        effective_date:
          type: string
          format: date-time
          description: ISO 8601 date when the change takes effect
        sender:
          $ref: '#/components/schemas/User'
        installation:
          $ref: '#/components/schemas/Installation'

    PersonalAccessTokenRequestPayload:
      type: object
      description: Payload for personal_access_token_request events
      required:
        - action
        - personal_access_token_request
      properties:
        action:
          description: "The action that was performed. Can be one of: created, approved, denied, cancelled."
          type: string
          enum:
            - approved
            - cancelled
            - created
            - denied
        personal_access_token_request:
          type: object
          description: A fine-grained personal access token request
          required:
            - id
            - owner
          properties:
            id:
              type: integer
              description: Unique identifier of the request for access via fine-grained personal access token. Used as the `pat_request_id` parameter in the list and review API calls.
            owner:
              $ref: '#/components/schemas/User'
            permissions_added:
              type: object
              description: |
                Permissions added by the request - each of organization/repository/other is a
                map of permission name to access level (e.g. "contents": "read"), NOT a
                reference to the Organization/Repository entity schemas despite the field names.
              properties:
                organization:
                  description: "Organization-level permissions requested, mapped from permission name to access level."
                  type: object
                  nullable: true
                  additionalProperties:
                    type: string
                repository:
                  description: "Repository-level permissions requested, mapped from permission name to access level."
                  type: object
                  nullable: true
                  additionalProperties:
                    type: string
                other:
                  description: "Other account-level permissions requested, mapped from permission name to access level."
                  type: object
                  nullable: true
                  additionalProperties:
                    type: string
            permissions_upgraded:
              type: object
              description: |
                Permissions upgraded from existing token - same permission-name-to-access-level
                map shape as permissions_added, not an entity reference.
              properties:
                organization:
                  description: "Organization-level permissions being upgraded, mapped from permission name to access level."
                  type: object
                  nullable: true
                  additionalProperties:
                    type: string
                repository:
                  description: "Repository-level permissions being upgraded, mapped from permission name to access level."
                  type: object
                  nullable: true
                  additionalProperties:
                    type: string
                other:
                  description: "Other account-level permissions being upgraded, mapped from permission name to access level."
                  type: object
                  nullable: true
                  additionalProperties:
                    type: string
            permissions_result:
              type: object
              description: |
                The resulting full set of permissions if approved - same permission-name-to-
                access-level map shape as permissions_added, not an entity reference.
              properties:
                organization:
                  description: "The resulting organization-level permissions if the request is approved, mapped from permission name to access level."
                  type: object
                  nullable: true
                  additionalProperties:
                    type: string
                repository:
                  description: "The resulting repository-level permissions if the request is approved, mapped from permission name to access level."
                  type: object
                  nullable: true
                  additionalProperties:
                    type: string
                other:
                  description: "The resulting other account-level permissions if the request is approved, mapped from permission name to access level."
                  type: object
                  nullable: true
                  additionalProperties:
                    type: string
            repository_selection:
              type: string
              enum:
                - none
                - all
                - subset
              description: Type of repository selection requested.
            repositories_url:
              description: "The API URL listing the repositories associated with this resource."
              type: string
              format: uri
              nullable: true
            repositories:
              type: array
              nullable: true
              items:
                $ref: '#/components/schemas/Repository'
              description: An array of repository objects the token is requesting access to. This field is only populated when `repository_selection` is `subset`.
            token_expired:
              type: boolean
              description: Whether the associated fine-grained personal access token has expired.
            token_expires_at:
              type: string
              format: date-time
              nullable: true
              description: Date and time when the associated fine-grained personal access token expires.
            token_last_used_at:
              type: string
              format: date-time
              nullable: true
              description: Date and time when the associated fine-grained personal access token was last used for authentication.
            created_at:
              type: string
              format: date-time
              description: Date and time when the request for access was created.
        sender:
          $ref: '#/components/schemas/User'
        organization:
          $ref: '#/components/schemas/Organization'
        installation:
          $ref: '#/components/schemas/Installation'
        enterprise:
          $ref: '#/components/schemas/Enterprise'

    ProjectPayload:
      type: object
      description: |
        Payload for project events (classic project boards).
        Note: classic Projects are deprecated; use projects_v2 instead.
      required:
        - action
        - project
      properties:
        action:

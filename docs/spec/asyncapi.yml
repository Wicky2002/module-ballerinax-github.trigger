                            type: string
                      commit_oid:
                        description: "The Git commit SHA associated with this package version."
                        type: string
                package_files:
                  description: "The downloadable files included in this package version."
                  type: array
                  items:
                    type: object
                    description: A single downloadable file within a published package version
                    properties:
                      download_url:
